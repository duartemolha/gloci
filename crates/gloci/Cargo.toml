[package]
name = "gloci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fast genomic interval and VCF toolkit: a single binary that replaces bedtools, bedops and vcftools."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gloci"
path = "src/main.rs"

[dependencies]
gloci-core.workspace = true
gloci-io.workspace = true
gloci-ops.workspace = true
gloci-vcf.workspace = true
clap.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
rayon.workspace = true
mimalloc.workspace = true
libmimalloc-sys.workspace = true

[dev-dependencies]
gloci-ops = { workspace = true, features = ["test-hooks"] }
gloci-testkit.workspace = true
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
tempfile.workspace = true
noodles-bgzf.workspace = true
noodles-bcf.workspace = true
noodles-tabix.workspace = true
noodles-vcf.workspace = true
noodles-sam.workspace = true
noodles-cram.workspace = true
noodles-fasta.workspace = true
libc.workspace = true
