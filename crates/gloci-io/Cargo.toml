[package]
name = "gloci-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Readers and writers for gloci: BED, GFF, VCF, BCF, BGZF, tabix and the built-in genome tables (internal crate, no stable API)."
license.workspace = true
repository.workspace = true
publish.workspace = true

# `--cfg fuzzing` is set by cargo-fuzz (fuzz/): the CRAM framing lets a wrong checksum through under it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
gloci-core.workspace = true
noodles-bgzf.workspace = true
noodles-core.workspace = true
noodles-csi.workspace = true
noodles-tabix.workspace = true
noodles-vcf.workspace = true
noodles-bcf.workspace = true
noodles-sam.workspace = true
noodles-bam.workspace = true
noodles-cram.workspace = true
noodles-fasta.workspace = true
flate2.workspace = true
thiserror.workspace = true
memchr.workspace = true
rust-lapper.workspace = true
ctrlc.workspace = true
log.workspace = true
tempfile.workspace = true

[dev-dependencies]
gloci-testkit.workspace = true
proptest.workspace = true
libc.workspace = true
toml.workspace = true
