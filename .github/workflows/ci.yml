name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: AVX2 coitrees test
        if: matrix.os == 'ubuntu-24.04'
        run: RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test -p gloci-engine

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Assert static binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/gloci
          file "$BIN"
          readelf -l "$BIN" > target/readelf.txt
          if grep -q INTERP target/readelf.txt; then
            echo "binary is dynamically linked"
            exit 1
          fi
