name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: with it the test binaries (about 180) are some 100 MB each, more than the
  # x86_64 runner's disk holds ("ld terminated with signal 7" when it filled up).
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The oldest Rust the workspace promises to build with (`rust-version` in Cargo.toml).
  MSRV: "1.91.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: actionlint
        if: matrix.os == 'ubuntu-24.04'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -ignore SC2086
      - run: cargo fmt --check
      - name: THIRD-PARTY-LICENSES is current
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo fetch --locked
          cargo xtask licenses --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test binary runs even after one fails, so a run shows all the failures of a platform.
      - run: cargo test --workspace --no-fail-fast
      - name: AVX2 coitrees test
        if: matrix.os == 'ubuntu-24.04'
        run: RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test -p gloci-engine

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Assert static binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/gloci
          file "$BIN"
          readelf -l "$BIN" > target/readelf.txt
          if grep -q INTERP target/readelf.txt; then
            echo "binary is dynamically linked"
            exit 1
          fi

  # Dry run only: this job never publishes anything.
  publish-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --dry-run --locked -p gloci-core -p gloci-chains -p gloci-chains-t2t -p gloci-io -p gloci-engine -p gloci-vcf -p gloci-ops -p gloci

  # rust-toolchain.toml pins a newer Rust, so the check names the toolchain with +.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +${{ env.MSRV }} check --workspace --locked
