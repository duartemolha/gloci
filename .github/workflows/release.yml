name: release
on:
  push:
    tags:
      - "v*"
  # A manual run builds and tests everything (archives, wheels, sdist, smoke tests) and
  # publishes nothing: every publish job and the GitHub Release need a tag push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only (a manual run never publishes, whatever this says)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # The tag a tag push names; "dry-run" for a manual run.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dry-run' }}

jobs:
  version:
    # The tag must name the version being built: v<workspace version>.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      # "true" when LICENSE exists; the publish jobs run only then.
      license: ${{ steps.meta.outputs.license }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Release metadata is consistent (tag, version, CHANGELOG, CITATION.cff, LICENSE)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask release-check --tag "$GITHUB_REF_NAME"
          else
            cargo xtask release-check
          fi
      - name: Workspace version
        id: meta
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f LICENSE ]; then echo "license=true" >> "$GITHUB_OUTPUT"; else echo "license=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signing and storing the build provenance (D176).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each Linux runner has its target's architecture, so musl-gcc builds natively, as
      # ci.yml's musl job does. zig 0.13's clang cannot compile libdeflate's aarch64 CRC code
      # ("Cannot select: intrinsic %llvm.aarch64.crypto.eor3u").
      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary (Linux musl)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The C dependencies (libdeflate, mimalloc) compile against musl.
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET" -p gloci
      - name: Build release binary (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target "${{ matrix.target }}" -p gloci
      - name: Assert static binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/gloci"
          file "$BIN"
          readelf -l "$BIN" > target/readelf.txt
          if grep -q -E 'INTERP|Requesting program interpreter' target/readelf.txt; then
            echo "binary is dynamically linked"
            exit 1
          fi
      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/gloci --version
      - name: Package release archive
        run: |
          STAGE="gloci-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/gloci" "dist/${STAGE}/gloci"
          cp SKILL.md CHANGELOG.md "dist/${STAGE}/"
          # SKILL.md is an index: the tables and differences it points to travel with it.
          mkdir -p "dist/${STAGE}/docs"
          cp docs/migration.md docs/differences.md "dist/${STAGE}/docs/"
          # Man pages and shell completions come from the clap definition.
          cargo run --locked -p xtask -- man --out "dist/${STAGE}/man"
          cargo run --locked -p xtask -- completions --out "dist/${STAGE}/completions"
          if [ -f README.md ]; then cp README.md "dist/${STAGE}/"; fi
          for f in LICENSE*; do
            if [ -f "$f" ]; then cp "$f" "dist/${STAGE}/"; fi
          done
          # The notices of the crates compiled into the binary (cargo xtask licenses).
          cp THIRD-PARTY-LICENSES "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
      # Build provenance (D176), on a tag push only: signed in the job that builds the file,
      # before anything is published. Check with `gh attestation verify FILE -R duartemolha/gloci`.
      - name: Attest the archive's build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/gloci-*-${{ matrix.target }}.tar.gz
      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/gloci-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Upload x86_64 static binary for container image
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/gloci
          if-no-files-found: error

  wheels:
    # abi3 wheels (one per platform covers Python 3.10 and up).
    name: wheel (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: 2014
          - name: manylinux2014-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2014
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signing and storing the build provenance (D176).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          maturin-version: v1.16.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.100.0"
          args: --profile release-py --locked -m crates/gloci-py/Cargo.toml --out dist
      # Build provenance (D176), on a tag push only: signed in the job that builds the file,
      # before anything is published. Check with `gh attestation verify FILE -R duartemolha/gloci`.
      - name: Attest the wheel's build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Signing and storing the build provenance (D176).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: -m crates/gloci-py/Cargo.toml --out dist
      # Build provenance (D176), on a tag push only: signed in the job that builds the file,
      # before anything is published. Check with `gh attestation verify FILE -R duartemolha/gloci`.
      - name: Attest the sdist's build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-smoke:
    # Install each wheel by itself (no network, no repository code) and run test_smoke.py.
    name: wheel smoke (${{ matrix.name }})
    needs: [version, wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014-x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64
          - name: manylinux2014-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GLOCI_EXPECT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheels-${{ matrix.name }}
          path: dist
      - name: Smoke test in the manylinux2014 image (oldest and newest CPython)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e GLOCI_EXPECT_VERSION -v "$PWD:/w" -w /w "${{ matrix.image }}" bash -euxo pipefail -c '
            auditwheel show dist/*.whl | tee /dev/stderr | grep manylinux_2_17
            newest="$(ls /opt/python | grep -E "^cp3[0-9]+-cp3[0-9]+$" | sort -V | tail -1)"
            for py in cp310-cp310 "$newest"; do
              /opt/python/$py/bin/python -m venv "/tmp/venv-$py"
              "/tmp/venv-$py/bin/pip" install --no-index --find-links dist gloci
              "/tmp/venv-$py/bin/python" crates/gloci-py/tests/test_smoke.py
            done
          '
      - name: Python 3.10 (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Python 3.14 (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Smoke test on macOS (Python 3.10 and 3.14)
        if: runner.os == 'macOS'
        run: |
          for v in 3.10 3.14; do
            "python$v" -m venv "venv-$v"
            "venv-$v/bin/pip" install --no-index --find-links dist gloci
            "venv-$v/bin/python" crates/gloci-py/tests/test_smoke.py
          done

  sdist-smoke:
    # Build the sdist from source with the minimum supported Rust and test the result.
    needs: [version, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GLOCI_EXPECT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist
      - name: Install from the sdist in python:3.12 with Rust 1.91
        run: |
          docker run --rm -e GLOCI_EXPECT_VERSION -v "$PWD:/w" -w /w python:3.12 bash -euxo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.91.0
            . "$HOME/.cargo/env"
            export RUSTUP_TOOLCHAIN=1.91.0
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install dist/gloci-*.tar.gz
            /tmp/venv/bin/python crates/gloci-py/tests/test_smoke.py
          '

  ghcr:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download x86_64 static binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bin-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - name: Compute lowercase image name
        id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/gloci" >> "$GITHUB_OUTPUT"
      # GHCR stays off until the owner sets the repository variable GLOCI_PUBLISH_GHCR=true (D80).
      - name: Log in to GitHub Container Registry
        if: vars.GLOCI_PUBLISH_GHCR == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push GHCR image
        if: vars.GLOCI_PUBLISH_GHCR == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: xtask/docker/Dockerfile.release
          build-args: |
            BIN=target/x86_64-unknown-linux-musl/release/gloci
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest

  # PyPI stays off until the owner sets the repository variable GLOCI_PUBLISH_PYPI=true (D80).
  # It needs a real tag push and a LICENSE file, and a trusted publisher set up on PyPI.
  publish-pypi:
    needs: [version, wheels, wheel-smoke, sdist, sdist-smoke]
    if: ${{ vars.GLOCI_PUBLISH_PYPI == 'true' && github.event_name == 'push' && needs.version.outputs.license == 'true' }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  # crates.io stays off until the owner sets the repository variable GLOCI_PUBLISH_CRATES=true (D80).
  # It needs a real tag push and a LICENSE file. A crate already published at this version is skipped.
  publish-crates:
    needs: [version, build, wheel-smoke, sdist-smoke]
    if: ${{ vars.GLOCI_PUBLISH_CRATES == 'true' && github.event_name == 'push' && needs.version.outputs.license == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for crate in gloci-core gloci-chains gloci-chains-t2t gloci-io gloci-engine gloci-vcf gloci-ops gloci; do
            if cargo info --registry crates-io "${crate}@${VERSION}" > /dev/null 2>&1; then
              echo "${crate} ${VERSION} is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "${crate}" --locked
          done

  # Created last, and when a publish job is skipped (they are off by default) but not after a failure.
  release:
    needs: [version, build, wheels, wheel-smoke, sdist, sdist-smoke, ghcr, publish-pypi, publish-crates]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release archives, wheels and sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "{archive-*,wheels-*,sdist}"
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release notes from CHANGELOG.md
        run: cargo xtask release-notes --version "${GITHUB_REF_NAME#v}" --out release-notes.md
      - name: Render the conda recipes with the real checksums
        if: ${{ !github.event.repository.private }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Skipped on a private repository (the archive URL is fetched anonymously); the Release is
          # still created. The tag archive exists once the tag does; the sdist is the one attached below.
          curl --proto '=https' --tlsv1.2 -sSfL -o tag-source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          cargo xtask conda render --version "$VERSION" \
            --sha256-cli "$(sha256sum tag-source.tar.gz | cut -d' ' -f1)" \
            --sha256-py "$(sha256sum "release-assets/gloci-${VERSION}.tar.gz" | cut -d' ' -f1)" \
            --out conda-recipes
          tar -czf release-assets/conda-recipes.tar.gz conda-recipes
      - name: Generate SHA256SUMS
        run: |
          cd release-assets || exit 1
          # conda-recipes.tar.gz is absent when the render step was skipped (a private repository).
          files=(gloci-*.tar.gz *.whl)
          if [ -f conda-recipes.tar.gz ]; then files+=(conda-recipes.tar.gz); fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-assets/gloci-*.tar.gz
            release-assets/*.whl
            release-assets/conda-recipes.tar.gz
            release-assets/SHA256SUMS
          body_path: release-notes.md
