name: release
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # The tag must name the version being built: v<workspace version>.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Release metadata is consistent (tag, version, CHANGELOG, CITATION.cff, LICENSE)
        run: cargo xtask release-check --tag "$GITHUB_REF_NAME"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          pip3 install --break-system-packages ziglang==0.13.0.post1
          cargo install --locked cargo-zigbuild --version 0.19.7
      - name: Build release binary (Linux musl)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}" -p gloci
      - name: Build release binary (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target "${{ matrix.target }}" -p gloci
      - name: Assert static binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/gloci"
          file "$BIN"
          readelf -l "$BIN" > target/readelf.txt
          if grep -q -E 'INTERP|Requesting program interpreter' target/readelf.txt; then
            echo "binary is dynamically linked"
            exit 1
          fi
      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/gloci --version
      - name: Package release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="gloci-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/gloci" "dist/${STAGE}/gloci"
          cp SKILL.md "dist/${STAGE}/"
          if [ -f README.md ]; then cp README.md "dist/${STAGE}/"; fi
          for f in LICENSE*; do
            if [ -f "$f" ]; then cp "$f" "dist/${STAGE}/"; fi
          done
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/gloci-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Upload x86_64 static binary for container image
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/gloci
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download release archives
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true
      - name: Download x86_64 static binary
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: bin-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - name: Generate SHA256SUMS
        run: |
          chmod +x target/x86_64-unknown-linux-musl/release/gloci
          cd release-assets || exit 1
          sha256sum gloci-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build release notes from CHANGELOG.md
        run: cargo xtask release-notes --version "${GITHUB_REF_NAME#v}" --out release-notes.md
      - name: Compute lowercase image name
        id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/gloci" >> "$GITHUB_OUTPUT"
      # GHCR stays off until the owner sets the repository variable GLOCI_PUBLISH_GHCR=true (D80).
      - name: Log in to GitHub Container Registry
        if: vars.GLOCI_PUBLISH_GHCR == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push GHCR image
        if: vars.GLOCI_PUBLISH_GHCR == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: xtask/docker/Dockerfile.release
          build-args: |
            BIN=target/x86_64-unknown-linux-musl/release/gloci
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
      # Created last, so a failed image push publishes no release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            release-assets/gloci-*.tar.gz
            release-assets/SHA256SUMS
          body_path: release-notes.md
