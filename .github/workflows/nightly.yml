name: nightly
# Runs weekly, on Sundays at 03:17 UTC, and when dispatched from the Actions tab or with
# `gh workflow run nightly.yml` (D175). "nightly" still names the tier of slow tests it runs.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  large-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The tests keep about 23 GiB of generated inputs for the whole run and a generated
      # SAM of 14 GiB while a BAM is made (see crates/gloci/tests/large.rs), and the build is
      # several GiB more: more than the runner's free disk as it comes. The job uses none of
      # the preinstalled SDKs below.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -- --ignored

  # The Python library's large tests (pytest -m large): memory stays flat while 5 million
  # records are iterated, and breaking out of a loop stops the steps. Built as the wheels are,
  # with the release-py profile.
  python-large:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Make a virtualenv with the test tools
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r crates/gloci-py/requirements-ci.txt
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build gloci-py into the virtualenv with the release-py profile
        run: maturin develop -m crates/gloci-py/Cargo.toml --profile release-py
      - name: pytest -m large
        run: pytest crates/gloci-py/tests -m large

  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: docker build -t gloci-diff:p0 xtask/docker
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Live comparison with the pinned reference tools
        run: cargo xtask diff --gloci target/x86_64-unknown-linux-musl/release/gloci
      - name: Golden files are current
        run: |
          cargo xtask diff --update-golden --gloci target/x86_64-unknown-linux-musl/release/gloci
          git diff --exit-code crates/gloci/tests/golden

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the benchmark container image
        run: docker build -t gloci-bench:p1 -f xtask/docker/Dockerfile.bench xtask/docker
      - name: Cache benchmark datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/bench-cache
          key: bench-datasets-${{ hashFiles('xtask/bench/datasets.toml') }}
      # A static binary runs inside the container whatever its glibc.
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      # The Python cases (gloci-py against pybedtools) install this wheel in the container.
      - name: Build the x86_64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: 2014
          rust-toolchain: "1.100.0"
          args: --profile release-py --locked -m crates/gloci-py/Cargo.toml --out wheel-dist
      - name: Benchmarks
        env:
          GLOCI_BENCH_CACHE: target/bench-cache
        run: >
          cargo xtask bench --check-targets --image gloci-bench:p1
          --gloci target/x86_64-unknown-linux-musl/release/gloci
          --wheel "$(ls wheel-dist/*.whl)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: bench-results
          path: bench-results/

  # The bioconda recipes build and install together (D93). Nothing is submitted to bioconda.
  conda-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Source trees for a local build (the tag archive and the unpacked sdist)
        run: |
          src="$RUNNER_TEMP/src"
          mkdir -p "$src/gloci" "$src/py-gloci" "$RUNNER_TEMP/sdist"
          git archive HEAD | tar -x -C "$src/gloci"
          pip3 install --break-system-packages maturin==1.16.0
          maturin sdist -m crates/gloci-py/Cargo.toml --out "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP/sdist"/gloci-*.tar.gz -C "$src/py-gloci" --strip-components=1
      - name: Render the recipes with --local
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          cargo xtask conda render --version "$version" --local "$RUNNER_TEMP/src" --out "$RUNNER_TEMP/recipes"
      - name: Build both recipes and install them into a fresh environment
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/src:$RUNNER_TEMP/src:ro" \
            -v "$RUNNER_TEMP/recipes:/recipes:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            -v "$PWD/packaging/bioconda/ci-build.sh:/ci-build.sh:ro" \
            condaforge/miniforge3:24.9.2-0@sha256:937dc1e8ab9ffc5f388f0d2a1ce5d24ba5b15850771571d7442fac1af53f3fad \
            bash /ci-build.sh /recipes /out

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-
      # Every file in fuzz/fuzz_targets is run, so a new target cannot be left out.
      - name: Fuzz each target for 180 s
        run: |
          rc=0
          for f in fuzz/fuzz_targets/*.rs; do
            t="$(basename "$f" .rs)"
            # Seed inputs (valid files past the headers); generated inputs stay untracked.
            mkdir -p "fuzz/corpus/$t"
            cp -n fuzz/seeds/"$t"/* "fuzz/corpus/$t"/ || true
            dict=""
            [ "$t" = vcf_reader ] && dict="-dict=fuzz/vcf.dict"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" -- -max_total_time=180 $dict || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
