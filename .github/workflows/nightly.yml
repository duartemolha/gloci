name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  large-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -- --ignored

  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: docker build -t gloci-diff:p0 xtask/docker
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Live comparison with the pinned reference tools
        run: cargo xtask diff --gloci target/x86_64-unknown-linux-musl/release/gloci
      - name: Golden files are current
        run: |
          cargo xtask diff --update-golden --gloci target/x86_64-unknown-linux-musl/release/gloci
          git diff --exit-code crates/gloci/tests/golden

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the reference-tool image
        run: docker build -t gloci-diff:p0 xtask/docker
      # A static binary runs inside the container whatever its glibc.
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Benchmarks
        run: >
          cargo xtask bench --check-targets
          --gloci target/x86_64-unknown-linux-musl/release/gloci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results/

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        run: |
          rc=0
          for t in bed_reader vcf_reader bcf_reader gff_reader bgzf_input region_parse; do
            # Seed inputs (valid files past the headers); generated inputs stay untracked.
            mkdir -p "fuzz/corpus/$t"
            cp -n fuzz/seeds/"$t"/* "fuzz/corpus/$t"/
            dict=""
            [ "$t" = vcf_reader ] && dict="-dict=fuzz/vcf.dict"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" -- -max_total_time=60 $dict || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
