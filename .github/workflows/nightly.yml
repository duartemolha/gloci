name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  large-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo test --release -- --ignored

  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: docker build -t gloci-diff:p0 xtask/docker
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      - name: Live comparison with the pinned reference tools
        run: cargo xtask diff --gloci target/x86_64-unknown-linux-musl/release/gloci
      - name: Golden files are current
        run: |
          cargo xtask diff --update-golden --gloci target/x86_64-unknown-linux-musl/release/gloci
          git diff --exit-code crates/gloci/tests/golden

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the benchmark container image
        run: docker build -t gloci-bench:p1 -f xtask/docker/Dockerfile.bench xtask/docker
      - name: Cache benchmark datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/bench-cache
          key: bench-datasets-${{ hashFiles('xtask/bench/datasets.toml') }}
      # A static binary runs inside the container whatever its glibc.
      - run: cargo build --release --target x86_64-unknown-linux-musl -p gloci
      # The Python cases (gloci-py against pybedtools) install this wheel in the container.
      - name: Build the x86_64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: 2014
          rust-toolchain: stable
          args: --profile release-py --locked -m crates/gloci-py/Cargo.toml --out wheel-dist
      - name: Benchmarks
        env:
          GLOCI_BENCH_CACHE: target/bench-cache
        run: >
          cargo xtask bench --check-targets --image gloci-bench:p1
          --gloci target/x86_64-unknown-linux-musl/release/gloci
          --wheel "$(ls wheel-dist/*.whl)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results
          path: bench-results/

  # The bioconda recipes build and install together (D93). Nothing is submitted to bioconda.
  conda-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Source trees for a local build (the tag archive and the unpacked sdist)
        run: |
          src="$RUNNER_TEMP/src"
          mkdir -p "$src/gloci" "$src/py-gloci" "$RUNNER_TEMP/sdist"
          git archive HEAD | tar -x -C "$src/gloci"
          pip3 install --break-system-packages maturin==1.16.0
          maturin sdist -m crates/gloci-py/Cargo.toml --out "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP/sdist"/gloci-*.tar.gz -C "$src/py-gloci" --strip-components=1
      - name: Render the recipes with --local
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          cargo xtask conda render --version "$version" --local "$RUNNER_TEMP/src" --out "$RUNNER_TEMP/recipes"
      - name: Build both recipes and install them into a fresh environment
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/src:$RUNNER_TEMP/src:ro" \
            -v "$RUNNER_TEMP/recipes:/recipes:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            -v "$PWD/packaging/bioconda/ci-build.sh:/ci-build.sh:ro" \
            condaforge/miniforge3:24.9.2-0@sha256:937dc1e8ab9ffc5f388f0d2a1ce5d24ba5b15850771571d7442fac1af53f3fad \
            bash /ci-build.sh /recipes /out

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Cache fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-
      - name: Fuzz each target for 60 s
        run: |
          rc=0
          for t in bed_reader vcf_reader bcf_reader bam_reader gff_reader bgzf_input region_parse; do
            # Seed inputs (valid files past the headers); generated inputs stay untracked.
            mkdir -p "fuzz/corpus/$t"
            cp -n fuzz/seeds/"$t"/* "fuzz/corpus/$t"/ || true
            dict=""
            [ "$t" = vcf_reader ] && dict="-dict=fuzz/vcf.dict"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" -- -max_total_time=60 $dict || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
