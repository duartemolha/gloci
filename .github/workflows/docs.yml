name: docs
# The book builds on every pull request; it deploys to GitHub Pages only on a v* tag push, and only when the repository variable
# GLOCI_PUBLISH_PAGES is 'true' (Pages must be enabled first, D80).
on:
  pull_request:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.4.52
      - name: Generate the reference and check every link
        run: cargo xtask book
      - name: Build the book (a warning fails the job)
        run: |
          mdbook build docs/book 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          ! grep -E 'WARN|ERROR' "$RUNNER_TEMP/mdbook.log"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.GLOCI_PUBLISH_PAGES == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
