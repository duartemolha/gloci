name: python
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Python library (crates/gloci-py): build it into a virtualenv and run its tests, which
  # compare pipelines with the gloci CLI built here. It never publishes anything.
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the CLI the tests compare with
        run: |
          cargo build -p gloci
          echo "GLOCI_BIN=$PWD/target/debug/gloci" >> "$GITHUB_ENV"
          # test_smoke.py checks the version gloci-py reports: the workspace version.
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"; test -n "$v"
          echo "GLOCI_EXPECT_VERSION=$v" >> "$GITHUB_ENV"
      - name: Make a virtualenv with the test tools
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r crates/gloci-py/requirements-ci.txt
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build gloci-py into the virtualenv
        run: maturin develop -m crates/gloci-py/Cargo.toml --features test-hooks
      - name: pytest
        run: pytest crates/gloci-py/tests -m "not large"
      # The stub types real usage: this cell has pyarrow, polars and pandas, whose types the
      # stub's return types name. It runs the stub's own check too (cargo test -p xtask --test
      # pystub: pyi_is_current), in ci.yml.
      - name: mypy --strict
        if: matrix.python == '3.12'
        run: mypy --strict crates/gloci-py/tests/typing_example.py

  # The Arrow output without pyarrow (D89): polars takes gloci's tables through the Arrow
  # PyCapsule interface, so a venv with polars and no pyarrow must pass. The tests that need
  # pyarrow (or pandas) skip.
  polars-only:
    name: pytest (polars without pyarrow)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the CLI the tests compare with
        run: |
          cargo build -p gloci
          echo "GLOCI_BIN=$PWD/target/debug/gloci" >> "$GITHUB_ENV"
          # test_smoke.py checks the version gloci-py reports: the workspace version.
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"; test -n "$v"
          echo "GLOCI_EXPECT_VERSION=$v" >> "$GITHUB_ENV"
      - name: Make a virtualenv with polars and without pyarrow
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r crates/gloci-py/requirements-polars-only.txt
          if "$RUNNER_TEMP/venv/bin/python" -c "import pyarrow" 2>/dev/null; then
            echo "pyarrow is installed; this job tests without it" >&2
            exit 1
          fi
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build gloci-py into the virtualenv
        run: maturin develop -m crates/gloci-py/Cargo.toml --features test-hooks
      - name: pytest
        run: pytest crates/gloci-py/tests -m "not large"

  # The lowest versions of the extras (pyproject.toml: pyarrow 23.0.1, polars 1.5, pandas 2.2) run the
  # same tests as the newest ones. pandas 2.2 has no Python 3.13 wheels, so this is Python 3.11.
  floors:
    name: pytest (lowest pyarrow, polars and pandas)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the CLI the tests compare with
        run: |
          cargo build -p gloci
          echo "GLOCI_BIN=$PWD/target/debug/gloci" >> "$GITHUB_ENV"
          # test_smoke.py checks the version gloci-py reports: the workspace version.
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"; test -n "$v"
          echo "GLOCI_EXPECT_VERSION=$v" >> "$GITHUB_ENV"
      - name: Make a virtualenv with the lowest extras
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r crates/gloci-py/requirements-floors.txt
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build gloci-py into the virtualenv
        run: maturin develop -m crates/gloci-py/Cargo.toml --features test-hooks
      - name: pytest
        run: pytest crates/gloci-py/tests -m "not large"
