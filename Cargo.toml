[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/duartemolha/gloci"
publish = true

[workspace.dependencies]
gloci-core = { path = "crates/gloci-core", version = "0.1.0" }
gloci-io = { path = "crates/gloci-io", version = "0.1.0" }
gloci-engine = { path = "crates/gloci-engine", version = "0.1.0" }
gloci-vcf = { path = "crates/gloci-vcf", version = "0.1.0" }
gloci-ops = { path = "crates/gloci-ops", version = "0.1.0" }
gloci-testkit = { path = "crates/gloci-testkit" }
noodles-bgzf = { version = "0.52", features = ["libdeflate"] }
noodles-vcf = "0.96"
noodles-bcf = "0.94"
noodles-csi = "0.62"
noodles-tabix = "0.68"
noodles-core = "0.21"
noodles-sam = "0.93"
noodles-bam = "0.98"
noodles-cram = { version = "0.102", features = ["libdeflate"] }
noodles-fasta = "0.68"
coitrees = "0.4"
rust-lapper = "2"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
flate2 = "1.1"
memchr = "2.8"
itoa = "1"
rayon = "1.12"
crossbeam-channel = "0.5"
lz4_flex = "0.14"
tempfile = "3.27"
ctrlc = { version = "3.5", features = ["termination"] }
# no_thp: mimalloc otherwise asks Linux for transparent huge pages for its whole arena, so
# every touched 2 MiB is resident. Without it peak memory falls by half or more (merge of
# 1.67M exons 26 -> 11 MiB, 8-thread BGZF intersect 258 -> 119 MiB, 8-thread vcf filter
# 83 -> 32 MiB) at the same speed (docs/design.md, Allocator).
mimalloc = { version = "0.1", features = ["no_thp"] }
# extended: mi_option_set, for the purge delay the binary sets at startup (crates/gloci/src/main.rs).
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
libc = "0.2"
libm = "0.2"
proptest = "1.12"
insta = "1.49"
assert_cmd = "2.2"
predicates = "3.1"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
tar = { version = "0.4", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The Python extension module (gloci-py, via maturin): release, but a panic unwinds so that it
# raises a Python exception instead of aborting the interpreter (D91).
[profile.release-py]
inherits = "release"
panic = "unwind"
