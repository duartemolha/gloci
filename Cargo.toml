[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
gloci-core = { path = "crates/gloci-core" }
gloci-io = { path = "crates/gloci-io" }
gloci-ops = { path = "crates/gloci-ops" }
gloci-testkit = { path = "crates/gloci-testkit" }
noodles-bgzf = { version = "0.52", features = ["libdeflate"] }
noodles-vcf = "0.96"
noodles-bcf = "0.94"
noodles-csi = "0.62"
noodles-tabix = "0.68"
noodles-core = "0.21"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
flate2 = "1.1"
memchr = "2.8"
itoa = "1"
rayon = "1.12"
crossbeam-channel = "0.5"
lz4_flex = "0.14"
tempfile = "3.27"
ctrlc = { version = "3.5", features = ["termination"] }
mimalloc = "0.1"
thiserror = "2"
anyhow = "1"
log = "0.4"
libc = "0.2"
proptest = "1.12"
insta = "1.49"
assert_cmd = "2.2"
predicates = "3.1"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
