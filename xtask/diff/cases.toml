# P3a Task 13
# view of CRAM (D109, D110) against samtools 1.21. The CRAM fixtures (aln/make-cram.sh) were
# written by samtools from the SAM fixtures with fa/ref.fa (3.0, 3.1, slices of several
# references, embedded reference, no reference); samtools reads them with `-T ref.fa` and
