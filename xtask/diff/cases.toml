name = "vcf-concat-bgzf-vs-bcftools-concat"
input = { file = "xtask/diff/inputs/concat-a.vcf" }
aux = ["xtask/diff/inputs/concat-b.vcf"]
gloci = "set -e; bgzip -c input.vcf > a.vcf.gz; bgzip -c concat-b.vcf > b.vcf.gz; gloci vcf concat a.vcf.gz b.vcf.gz"
reference = "set -e; bgzip -c input.vcf > a.vcf.gz; bgzip -c concat-b.vcf > b.vcf.gz; tabix -p vcf a.vcf.gz; tabix -p vcf b.vcf.gz; bcftools concat a.vcf.gz b.vcf.gz"
compare = "vcf-records"

