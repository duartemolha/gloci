aux = ["xtask/diff/inputs/p3b/stats/fisher-exq-b.bed", "xtask/diff/inputs/p3b/stats/fisher-exq-gap.bed", "xtask/diff/inputs/p3b/stats/fisher-exq-genome.txt"]
