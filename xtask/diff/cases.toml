# Differential cases. Commands run with the case directory as working directory:
# the input is `input.<ext>`, `aux` files keep their basename, `gloci` is on PATH.
# A case without `expected_difference` must match; one with it must differ, and
# the anchor must exist in docs/differences.md.
#
# A case whose `gloci` is a single plain `gloci ARGS` invocation (no shell
# syntax) also becomes a committed golden case, replayed by `cargo test`.

# Inputs: ties.bed has start ties (different ends, names, exact duplicates),
# points, bookended and nested features in a shuffled order over chr1, chr2,
# chr10, chrX, chrM. ties-nopoints.bed drops the points (sort-bed rejects
# zero-length records). distinct-starts.bed keeps the first record per
# (chrom, start), so tie order cannot matter.

[[case]]
name = "sort-bed-vs-sort-bed"
input = { file = "xtask/diff/inputs/ties-nopoints.bed" }
gloci = "gloci sort --chrom-order lex --full-key input.bed"
reference = "sort-bed input.bed"
compare = "exact"

[[case]]
name = "sort-bed-tie-order-vs-sort-bed"
input = { file = "xtask/diff/inputs/ties-nopoints.bed" }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "sort-bed input.bed"
compare = "exact"
expected_difference = "#sort-tie-order"

[[case]]
name = "sort-bed-vs-bedtools-sort"
input = { file = "xtask/diff/inputs/distinct-starts.bed" }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "bedtools sort -i input.bed"
compare = "exact"

[[case]]
name = "sort-bed-tie-order-vs-bedtools-sort"
input = { file = "xtask/diff/inputs/ties.bed" }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "bedtools sort -i input.bed"
compare = "exact"
expected_difference = "#sort-tie-order"

[[case]]
name = "sort-bed-generated-vs-bedtools-sort"
input = { gen = ["bed", "--records", "1500", "--chroms", "12", "--seed", "11"] }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "bedtools sort -i input.bed"
compare = "exact"

[[case]]
name = "sort-bed-vs-gnu-sort"
input = { file = "xtask/diff/inputs/distinct-starts.bed" }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "LC_ALL=C sort -k1,1 -k2,2n -s input.bed"
compare = "exact"

[[case]]
name = "sort-bed-karyotype-default-vs-bedtools-sort"
input = { file = "xtask/diff/inputs/distinct-starts.bed" }
gloci = "gloci sort input.bed"
reference = "bedtools sort -i input.bed"
compare = "exact"
expected_difference = "#karyotype-chromosome-order"

[[case]]
name = "sort-bed-vs-bedtools-sort-genome"
input = { file = "xtask/diff/inputs/distinct-starts.bed" }
aux = ["xtask/diff/inputs/genome.txt"]
gloci = "gloci sort -g genome.txt input.bed"
reference = "bedtools sort -i input.bed -g genome.txt"
compare = "exact"

[[case]]
name = "sort-vcf-vs-bcftools-sort"
input = { file = "xtask/diff/inputs/unsorted-distinct.vcf" }
gloci = "gloci sort input.vcf"
reference = "bcftools sort input.vcf"
compare = "vcf-records"

[[case]]
name = "sort-vcf-tie-order-vs-bcftools-sort"
input = { file = "xtask/diff/inputs/unsorted-ties.vcf" }
gloci = "gloci sort input.vcf"
reference = "bcftools sort input.vcf"
compare = "vcf-records"
expected_difference = "#sort-tie-order"

# tabix reads a BGZF copy through its own index; gloci scans the plain file.
# Regions are disjoint so that no record is printed twice.

[[case]]
name = "view-region-ref-inclusive-vs-tabix"
input = { file = "xtask/diff/inputs/regions.vcf" }
gloci = "gloci view --no-header --vcf-span ref --inclusive-points input.vcf chr1:100-100 chr1:101-101 chr1:150-190 chr1:200-200 chr1:300-420 chr2:100-100 chr2:495-505"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr1:100-100 chr1:101-101 chr1:150-190 chr1:200-200 chr1:300-420 chr2:100-100 chr2:495-505"
compare = "exact"

[[case]]
name = "view-region-default-vs-tabix"
input = { file = "xtask/diff/inputs/regions.vcf" }
# Insertions only (points under the allele span): strictly-inside rule.
gloci = "gloci view --no-header input.vcf chr1:100-100 chr1:101-101 chr1:200-200 chr2:100-100"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr1:100-100 chr1:101-101 chr1:200-200 chr2:100-100"
compare = "exact"
expected_difference = "#view-region-footprints"

[[case]]
name = "view-region-allele-inclusive-vs-tabix"
input = { file = "xtask/diff/inputs/regions.vcf" }
# Same queries with inclusive points: the point rule alone explains the gap above.
gloci = "gloci view --no-header --inclusive-points input.vcf chr1:100-100 chr1:101-101 chr1:200-200 chr2:100-100"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr1:100-100 chr1:101-101 chr1:200-200 chr2:100-100"
compare = "exact"

[[case]]
name = "view-region-allele-span-vs-tabix"
input = { file = "xtask/diff/inputs/regions.vcf" }
# A deletion (ACGT>A at 150): its allele footprint starts after the anchor base.
gloci = "gloci view --no-header --inclusive-points input.vcf chr1:150-150"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr1:150-150"
compare = "exact"
expected_difference = "#default-vcf-span-allele"

[[case]]
name = "view-svlen-only-sv-vs-tabix"
input = { file = "xtask/diff/inputs/svlen.vcf" }
# <DEL> with SVLEN=-50000 and no END at 1000: the region 40000-40100 touches only its tail, in another 16 kb index bin than its start.
gloci = "gloci view --no-header input.vcf chr1:40000-40100"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr1:40000-40100"
compare = "exact"
expected_difference = "#htslib-index-svlen"

[[case]]
name = "index-svlen-only-sv-vs-tabix"
input = { file = "xtask/diff/inputs/svlen.vcf" }
gloci = "set -e; gloci sort input.vcf -o g.vcf.gz --write-index; gloci view --no-header g.vcf.gz chr1:40000-40100"
reference = "set -e; bgzip -c input.vcf > t.vcf.gz; tabix -p vcf t.vcf.gz; tabix t.vcf.gz chr1:40000-40100"
compare = "exact"
expected_difference = "#htslib-index-svlen"

# The limitation the other way round: gloci reading an htslib-built index sees
# what htslib sees, so it misses the tail-touching SV too.
[[case]]
name = "index-htslib-built-svlen-gloci-view-vs-tabix"
input = { file = "xtask/diff/inputs/svlen.vcf" }
gloci = "set -e; bgzip -c input.vcf > u.vcf.gz; tabix -p vcf u.vcf.gz; gloci view --no-header u.vcf.gz chr1:40000-40100"
reference = "set -e; bgzip -c input.vcf > t.vcf.gz; tabix -p vcf t.vcf.gz; tabix t.vcf.gz chr1:40000-40100"
compare = "exact"

# BED regions: sorted-nopoints.bed has start ties, bookended and nested
# features but no points; sorted-points.bed has zero-length records. One region
# per chromosome, so no record is printed twice.

[[case]]
name = "view-bed-region-vs-tabix"
input = { file = "xtask/diff/inputs/sorted-nopoints.bed" }
gloci = "gloci view --chrom-order lex input.bed chr1:201-210 chr10:1-60 chr2:100-120 chrM:1-5 chrX:9-12"
reference = "bgzip -c input.bed > i.bed.gz && tabix -p bed i.bed.gz && tabix i.bed.gz chr1:201-210 chr10:1-60 chr2:100-120 chrM:1-5 chrX:9-12"
compare = "exact"

# tabix treats a zero-length BED record as empty, so it never returns a point
# on a region's edge but does return one strictly inside. gloci's default
# agrees; --inclusive-points deliberately differs.
[[case]]
name = "view-bed-region-points-vs-tabix"
input = { file = "xtask/diff/inputs/sorted-points.bed" }
gloci = "gloci view --chrom-order lex input.bed chr1:101-101 chr10:1-1 chr2:91-110 chrM:101-101 chrX:91-110"
reference = "bgzip -c input.bed > i.bed.gz && tabix -p bed i.bed.gz && tabix i.bed.gz chr1:101-101 chr10:1-1 chr2:91-110 chrM:101-101 chrX:91-110"
compare = "exact"

[[case]]
name = "view-bed-region-points-inclusive-vs-tabix"
input = { file = "xtask/diff/inputs/sorted-points.bed" }
gloci = "gloci view --chrom-order lex --inclusive-points input.bed chr1:101-101 chr10:1-1 chr2:91-110 chrM:101-101 chrX:91-110"
reference = "bgzip -c input.bed > i.bed.gz && tabix -p bed i.bed.gz && tabix i.bed.gz chr1:101-101 chr10:1-1 chr2:91-110 chrM:101-101 chrX:91-110"
compare = "exact"
expected_difference = "#view-region-footprints"

[[case]]
name = "view-bed-assume-sorted-vs-bedextract"
input = { file = "xtask/diff/inputs/nonnested.bed" }
aux = ["xtask/diff/inputs/regions.bed"]
gloci = "gloci view --chrom-order lex --assume-sorted input.bed --regions-file regions.bed"
reference = "bedextract input.bed regions.bed"
compare = "exact"

# bedextract silently misses a long feature that starts before the region and
# drops fully nested features; gloci finds the long feature.
[[case]]
name = "view-bed-assume-sorted-nested-vs-bedextract"
input = { file = "xtask/diff/inputs/nestedsorted.bed" }
aux = ["xtask/diff/inputs/regions.bed"]
gloci = "gloci view --chrom-order lex --assume-sorted input.bed --regions-file regions.bed"
reference = "bedextract input.bed regions.bed"
compare = "exact"
expected_difference = "#view-assume-sorted"

# Error behaviour is pinned by exit status.

# bedextract trusts the order of an unsorted file; gloci's default scan checks it.
[[case]]
name = "view-bed-unsorted-vs-bedextract"
input = { file = "xtask/diff/inputs/unsorted.bed" }
gloci = "gloci view --chrom-order lex input.bed chr1:1-100"
reference = "bedextract chr1 input.bed"
compare = "exit-status"
expected_difference = "#view-assume-sorted"

[[case]]
name = "sort-check-start-ties-vs-sort-bed"
input = { file = "xtask/diff/inputs/check-ends.bed" }
gloci = "gloci sort --check input.bed"
reference = "sort-bed --check-sort input.bed"
compare = "exit-status"
expected_difference = "#sort-check-chrom-start"

[[case]]
name = "truncated-bgzf-vs-bgzip"
input = { file = "xtask/diff/inputs/truncated.bed.gz" }
gloci = "gloci view input.bed.gz"
reference = "bgzip -dc input.bed.gz"
compare = "exit-status"
expected_difference = "#bgzf-eof-marker"

[[case]]
name = "vcf-to-bcf-bad-header-vs-bcftools"
input = { file = "xtask/diff/inputs/dup-info.vcf" }
gloci = "gloci view -O bcf input.vcf"
reference = "bcftools view -Ob input.vcf"
compare = "exit-status"
expected_difference = "#vcf-header-conversion"

# A String FORMAT key after the first: htslib writes each value one byte wider
# than the longest, and gloci does the same. The last bytes of the record (the
# AB field) are compared.
[[case]]
name = "vcf-to-bcf-string-width-vs-bcftools"
input = { file = "xtask/diff/inputs/bcf-string-width.vcf" }
gloci = "set -e; gloci view -O bcf input.vcf -o g.bcf; gzip -dc g.bcf | tail -c 12 | od -An -tx1"
reference = "set -e; bcftools view -Ob -o t.bcf input.vcf; gzip -dc t.bcf | tail -c 12 | od -An -tx1"
compare = "exact"

# Mixed ploidy (a missing haploid `.` next to diploid calls): bcftools reads
# gloci's BCF records as it reads its own conversion.
[[case]]
name = "vcf-to-bcf-mixed-ploidy-vs-bcftools"
input = { file = "xtask/diff/inputs/mixed-ploidy-missing.vcf" }
gloci = "set -e; gloci view -O bcf input.vcf -o g.bcf; bcftools view -H g.bcf"
reference = "set -e; bcftools view -Ob -o t.bcf input.vcf; bcftools view -H t.bcf"
compare = "exact"

# The risky GT encoder paths: alleles of 63 and more (int16), GT after another
# FORMAT field, mixed ploidy, phase on missing alleles, samples cut short.
# The same input is the byte-parity fixture in crates/gloci/tests/bcf-gt-parity.
[[case]]
name = "vcf-to-bcf-gt-encoding-vs-bcftools"
input = { file = "xtask/diff/inputs/bcf-gt-encoding.vcf" }
gloci = "set -e; gloci view -O bcf input.vcf -o g.bcf; bcftools view -H g.bcf"
reference = "set -e; bcftools view -Ob -o t.bcf input.vcf; bcftools view -H t.bcf"
compare = "exact"

[[case]]
name = "sort-bed-points-vs-sort-bed"
input = { file = "xtask/diff/inputs/ties.bed" }
gloci = "gloci sort --chrom-order lex input.bed"
reference = "sort-bed input.bed"
compare = "exit-status"
expected_difference = "#zero-length-bed-records"

# The header: the ##glociCommand line is the only difference here (the input
# already has the ##FILTER=<ID=PASS> line htslib puts second).
[[case]]
name = "sort-vcf-header-vs-bcftools-sort"
input = { file = "xtask/diff/inputs/hdr-distinct.vcf" }
gloci = "gloci sort input.vcf"
reference = "bcftools sort input.vcf"
compare = "exact"
expected_difference = "#glocicommand-header"

# htslib reads through the index gloci built and through its own: the queries
# must return the same records.

[[case]]
name = "index-interop-tabix-queries"
input = { gen = ["vcf", "--records", "1500", "--chroms", "5", "--seed", "21"] }
gloci = '''set -e; gloci sort input.vcf -o g.vcf.gz --write-index; for q in chr1:1-50000000 chr2:100000000-180000000 chr3 chr4:1-1000 chr5:60000000-250000000; do tabix g.vcf.gz $q; done'''
reference = '''set -e; bgzip -c input.vcf > t.vcf.gz; tabix -p vcf t.vcf.gz; for q in chr1:1-50000000 chr2:100000000-180000000 chr3 chr4:1-1000 chr5:60000000-250000000; do tabix t.vcf.gz $q; done'''
compare = "exact"

[[case]]
name = "index-interop-tabix-queries-small"
input = { file = "xtask/diff/inputs/regions.vcf" }
gloci = '''set -e; gloci sort input.vcf -o g.vcf.gz --write-index; for q in chr1:100-100 chr1:250-250 chr1:399-401 chr1:402-1000 chr2 chr2:499-499; do tabix g.vcf.gz $q; done'''
reference = '''set -e; bgzip -c input.vcf > t.vcf.gz; tabix -p vcf t.vcf.gz; for q in chr1:100-100 chr1:250-250 chr1:399-401 chr1:402-1000 chr2 chr2:499-499; do tabix t.vcf.gz $q; done'''
compare = "exact"

# Records on a contig the ##contig lines omit (undeclared-contig.vcf has chr2
# only in its records). Commands that need no chromosome order accept them
# with a warning, as htslib does.

[[case]]
name = "view-region-undeclared-contig-vs-tabix"
input = { file = "xtask/diff/inputs/undeclared-contig.vcf" }
gloci = "gloci view --no-header input.vcf chr2:60-100"
reference = "bgzip -c input.vcf > i.vcf.gz && tabix -p vcf i.vcf.gz && tabix i.vcf.gz chr2:60-100"
compare = "exact"

[[case]]
name = "view-region-undeclared-contig-vs-bcftools-view"
input = { file = "xtask/diff/inputs/undeclared-contig.vcf" }
gloci = "gloci view --no-header input.vcf chr2:60-100"
reference = "bgzip -c input.vcf > i.vcf.gz && bcftools index -t i.vcf.gz && bcftools view -H -r chr2:60-100 i.vcf.gz"
compare = "exact"

# Commands that need an order refuse; bcftools sort appends the contig.
[[case]]
name = "sort-undeclared-contig-vs-bcftools-sort"
input = { file = "xtask/diff/inputs/undeclared-contig.vcf" }
gloci = "gloci sort input.vcf"
reference = "bcftools sort input.vcf"
compare = "exit-status"
expected_difference = "#undeclared-contig-sort"

# Index interop for every index type: htslib reads the index gloci built and
# the queries must return what the same tool returns through its own index.

[[case]]
name = "index-interop-bcf-csi-bcftools-view"
input = { file = "xtask/diff/inputs/regions.vcf" }
gloci = '''set -e; gloci view input.vcf -o g.bcf --write-index; for q in chr1:100-100 chr1:150-160 chr1:260-390 chr1:402-1000 chr2 chr2:499-499; do bcftools view -H -r $q g.bcf; done'''
reference = '''set -e; bcftools view -Ob -o t.bcf input.vcf; bcftools index t.bcf; for q in chr1:100-100 chr1:150-160 chr1:260-390 chr1:402-1000 chr2 chr2:499-499; do bcftools view -H -r $q t.bcf; done'''
compare = "exact"

# The first two lines are a track and a browser line: the index must skip them.
[[case]]
name = "index-interop-bed-tbi-header-lines-tabix"
input = { file = "xtask/diff/inputs/track-header.bed" }
gloci = '''set -e; gloci sort --chrom-order lex --header input.bed -o g.bed.gz --write-index; for q in chr1:150-160 chr1:4000-6000 chr2 chr2:92-96; do tabix g.bed.gz $q; done'''
reference = '''set -e; bgzip -c input.bed > t.bed.gz; tabix -p bed -S 2 t.bed.gz; for q in chr1:150-160 chr1:4000-6000 chr2 chr2:92-96; do tabix t.bed.gz $q; done'''
compare = "exact"

[[case]]
name = "index-interop-bedgraph-tbi-tabix"
input = { file = "xtask/diff/inputs/signal.bedgraph" }
gloci = '''set -e; gloci sort --chrom-order lex input.bedgraph -o g.bedgraph.gz --write-index; for q in chr1:90-110 chr1:30000-45000 chr2 chr2:499-501; do tabix g.bedgraph.gz $q; done'''
reference = '''set -e; bgzip -c input.bedgraph > t.bedgraph.gz; tabix -p bed t.bedgraph.gz; for q in chr1:90-110 chr1:30000-45000 chr2 chr2:499-501; do tabix t.bedgraph.gz $q; done'''
compare = "exact"

[[case]]
name = "index-interop-gff3-tbi-tabix"
input = { file = "xtask/diff/inputs/feats.gff3" }
gloci = '''set -e; gloci sort --chrom-order lex --header input.gff3 -o g.gff3.gz --write-index; for q in chr1:150-160 chr1:350-450 chr1:25000-25100 chr2 chr2:1500-1600; do tabix g.gff3.gz $q; done'''
reference = '''set -e; bgzip -c input.gff3 > t.gff3.gz; tabix -p gff t.gff3.gz; for q in chr1:150-160 chr1:350-450 chr1:25000-25100 chr2 chr2:1500-1600; do tabix t.gff3.gz $q; done'''
compare = "exact"

# A feature ends beyond 2^29: gloci writes a CSI (TBI cannot hold it) and tabix
# must read it.
[[case]]
name = "index-interop-bed-csi-large-end-tabix"
input = { file = "xtask/diff/inputs/bigend.bed" }
gloci = '''set -e; gloci sort --chrom-order lex input.bed -o g.bed.gz --write-index; test -f g.bed.gz.csi; for q in chr1:1500-1600 chr1:600000010-600000020 chr1:600000500-600000600 chr2:536870900-536871100 chr2:699999999-700001000; do tabix g.bed.gz $q; done'''
reference = '''set -e; bgzip -c input.bed > t.bed.gz; tabix -C -p bed t.bed.gz; for q in chr1:1500-1600 chr1:600000010-600000020 chr1:600000500-600000600 chr2:536870900-536871100 chr2:699999999-700001000; do tabix t.bed.gz $q; done'''
compare = "exact"

# A BCF whose contigs are each contiguous but not in dictionary order:
# bcftools index accepts it, gloci index refuses (exit 1).
[[case]]
name = "index-bcf-contigs-out-of-dictionary-order-vs-bcftools"
input = { file = "xtask/diff/inputs/contig-reversed.vcf" }
gloci = "gloci view input.vcf -o x.bcf && gloci index x.bcf"
reference = "bcftools view -Ob -o x.bcf input.vcf && bcftools index x.bcf"
compare = "exit-status"
expected_difference = "#bcf-index-contig-order"

# TSV indexing with -s/-b/-e: htslib reads the index gloci built, and the
# queries must return what tabix returns through its own index.

[[case]]
name = "index-tsv-bed-like-vs-tabix"
input = { file = "xtask/diff/inputs/bedlike.tsv" }
gloci = '''set -e; bgzip -c input.tsv > g.tsv.gz; gloci index -s 1 -b 2 -e 3 --zero-based g.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix g.tsv.gz $q; done'''
reference = '''set -e; bgzip -c input.tsv > t.tsv.gz; tabix -s1 -b2 -e3 -0 t.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix t.tsv.gz $q; done'''
compare = "exact"

[[case]]
name = "index-tsv-one-based-vs-tabix"
input = { file = "xtask/diff/inputs/onebased.tsv" }
gloci = '''set -e; bgzip -c input.tsv > g.tsv.gz; gloci index -s 1 -b 2 -e 2 g.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix g.tsv.gz $q; done'''
reference = '''set -e; bgzip -c input.tsv > t.tsv.gz; tabix -s1 -b2 -e2 t.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix t.tsv.gz $q; done'''
compare = "exact"

[[case]]
name = "index-tsv-one-based-end-column-vs-tabix"
input = { file = "xtask/diff/inputs/onebased.tsv" }
gloci = '''set -e; bgzip -c input.tsv > g.tsv.gz; gloci index -s 1 -b 2 -e 3 g.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix g.tsv.gz $q; done'''
reference = '''set -e; bgzip -c input.tsv > t.tsv.gz; tabix -s1 -b2 -e3 t.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40005-40006 chr1:100000-200000 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix t.tsv.gz $q; done'''
compare = "exact"

[[case]]
name = "index-tsv-skip-lines-vs-tabix"
input = { file = "xtask/diff/inputs/positions.tsv" }
gloci = '''set -e; bgzip -c input.tsv > g.tsv.gz; gloci index -s 1 -b 2 --skip-lines 1 --comment % g.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40006-40006 chr1:40005-40005 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix g.tsv.gz $q; done'''
reference = '''set -e; bgzip -c input.tsv > t.tsv.gz; tabix -s1 -b2 -S1 -c% t.tsv.gz; for q in chr1:1-100 chr1:20050-40001 chr1:40006-40006 chr1:40005-40005 chr2:1-50000 chr2 chr10:30000-60000 chrX:1-1000000; do tabix t.tsv.gz $q; done'''
compare = "exact"

