# P3b Task 23: vcf merge vs bcftools merge --no-version (1.21)
# a.vcf (A1, A2), b.vcf (B1) and c.vcf (C1, C2) share sites: identical records, the same POS with
# different ALTs (1:100 A>C, A>G; 1:150 T,A against A against T,C), a SNP and an indel at 1:300, a
# haploid sample at 1:350, a site only one file has, and a second contig. The reference needs
# bgzipped, indexed inputs; gloci reads them plain.

# Two files, bcftools' default -m both: 1:100 A>C and A>G become A C,G, 1:300 stays two records (SNP and
# indel), and a record only one file has gets ./. for the others.
[[case]]
name = "vcf-merge-two-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bcftools merge --no-version input.vcf.gz b.vcf.gz"
compare = "vcf-records"

# Three files at 1:150: a's T,A pairs with c's T,C (they share T), b's A stays alone; GT, AD, PL and GL
# are re-indexed to the merged T,A,C.
[[case]]
name = "vcf-merge-three-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

# -m none: records pair only when they share an allele; 1:100 A>C and A>G stay two records.
[[case]]
name = "vcf-merge-mode-none-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
