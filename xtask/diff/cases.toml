# shift (Task 7, D70). shift-in.bed is transform-in.bed without the feature
# that every positive shift pushes wholly past the chromosome end, plus an
# unknown-strand feature in mid-chromosome. bedtools -s N is --by N; its
# -p X -m -X pair is --by X -s; -pct is --pct.

[[case]]
name = "shift-by-vs-bedtools"
input = { file = "xtask/diff/inputs/shift-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci shift --by 10 -g comp.genome input.bed"
reference = "bedtools shift -i input.bed -g comp.genome -s 10"
compare = "exact"

[[case]]
name = "shift-negative-vs-bedtools"
input = { file = "xtask/diff/inputs/shift-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci shift --by -10 -g comp.genome input.bed"
reference = "bedtools shift -i input.bed -g comp.genome -s -10"
compare = "exact"

[[case]]
name = "shift-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/shift-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci shift --by 5 -s -g comp.genome input.bed"
reference = "bedtools shift -i input.bed -g comp.genome -p 5 -m -5"
compare = "exact"

[[case]]
name = "shift-pct-vs-bedtools"
input = { file = "xtask/diff/inputs/shift-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci shift --pct --by 0.25 -g comp.genome input.bed"
