reference = "bedtools jaccard -a input.bed -b jaccard-b6.bed -s"
compare = "exact"

[[case]]
name = "stats-jaccard-fraction-vs-bedtools"
input = { file = "xtask/diff/inputs/p3b/stats/jaccard-fa.bed" }
aux = ["xtask/diff/inputs/p3b/stats/jaccard-fb.bed"]
gloci = "gloci stats jaccard --chrom-order lex -a input.bed -b jaccard-fb.bed -f 0.5"
reference = "bedtools jaccard -a input.bed -b jaccard-fb.bed -f 0.5"
compare = "exact"

[[case]]
name = "stats-jaccard-fraction-reciprocal-vs-bedtools"
input = { file = "xtask/diff/inputs/p3b/stats/jaccard-fa.bed" }
aux = ["xtask/diff/inputs/p3b/stats/jaccard-fb.bed"]
gloci = "gloci stats jaccard --chrom-order lex -a input.bed -b jaccard-fb.bed -f 0.5 -r"
reference = "bedtools jaccard -a input.bed -b jaccard-fb.bed -f 0.5 -r"
compare = "exact"

[[case]]
name = "stats-jaccard-fraction-b-vs-bedtools"
input = { file = "xtask/diff/inputs/p3b/stats/jaccard-fa.bed" }
aux = ["xtask/diff/inputs/p3b/stats/jaccard-fb.bed"]
gloci = "gloci stats jaccard --chrom-order lex -a input.bed -b jaccard-fb.bed -F 0.5"
reference = "bedtools jaccard -a input.bed -b jaccard-fb.bed -F 0.5"
compare = "exact"

[[case]]
