reference = "bgzip -c input.vcf > a.vcf.gz && bgzip -c rel-multi-b.vcf > b.vcf.gz && tabix a.vcf.gz && tabix b.vcf.gz && bcftools isec -n=2 -w1 -c none a.vcf.gz b.vcf.gz"
compare = "vcf-records"

