# convert (Task 19). vcf2bed writes ID, QUAL, REF, ALT, FILTER, INFO after the
# coordinates; the awk in the reference puts them in gloci's order (ID, REF,
# ALT, QUAL, FILTER) and drops INFO. vcf2bed also writes one row per ALT and
# spans each variant its own way, so most of these inputs are single-ALT.
# bedops gff2bed leaves the name column "." for GFF3.

[[case]]
name = "convert-vcf-ref-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-snv-ins.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"

[[case]]
name = "convert-vcf-ref-coordinates-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-snv-ins.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref | cut -f1-3"
reference = "vcf2bed < input.vcf | cut -f1-3"
compare = "exact"

# Without --deletions vcf2bed gives a deletion its single anchor base.
