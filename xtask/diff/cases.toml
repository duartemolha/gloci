# and unplaced unmapped reads, and flags of every kind.
[[case]]
name = "convert-cram-vs-bamtobed"
input = { file = "xtask/diff/inputs/aln/many.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai"]
gloci = "gloci convert input.cram --reference ref.fa"
reference = "samtools view -b -T ref.fa --input-fmt-option decode_md=0 -o d.bam input.cram && bedtools bamtobed -i d.bam"
compare = "exact"

[[case]]
name = "intersect-bed-cram-count-vs-bedtools"
input = { file = "xtask/diff/inputs/aln/many.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/many-targets.bed"]
gloci = "gloci intersect -a many-targets.bed -b input.cram --reference ref.fa --mode count"
reference = "samtools view -b -T ref.fa --input-fmt-option decode_md=0 -o d.bam input.cram && bedtools intersect -a many-targets.bed -b d.bam -c"
compare = "exact"

[[case]]
name = "coverage-bed-cram-vs-bedtools"
input = { file = "xtask/diff/inputs/aln/many.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/many-targets.bed"]
gloci = "gloci coverage -a many-targets.bed -b input.cram --reference ref.fa"
reference = "samtools view -b -T ref.fa --input-fmt-option decode_md=0 -o d.bam input.cram && bedtools coverage -a many-targets.bed -b d.bam"
compare = "numeric"

[[case]]
name = "genomecov-cram-split-deletions-vs-bedtools"
input = { file = "xtask/diff/inputs/aln/many.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai"]
gloci = "gloci genomecov input.cram --reference ref.fa --bedgraph --split-deletions"
reference = "samtools view -b -T ref.fa --input-fmt-option decode_md=0 -o d.bam input.cram && bedtools genomecov -ibam d.bam -bg -split"
compare = "exact"

# Regions through the .crai (D116): a read unmapped but placed at a position counts as one base
# there, and a read that runs past the end of its reference is found by its uncut span, as
# samtools finds them (a region that starts past the end of the reference finds nothing, as in
# samtools: the .crai clips a slice's span there). Regions are given in file order: gloci writes
# the references in the file's order, samtools in the order asked. The .crai is samtools' own,
# named for the input.
[[case]]
name = "view-cram-region-vs-samtools"
input = { file = "xtask/diff/inputs/aln/many.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/index/many/input.cram.crai"]
gloci = "gloci view -O sam input.cram --reference ref.fa chrM chr1:100-400 chr2:51-55 chrX:770-777"
reference = "samtools view -h --no-PG --input-fmt-option decode_md=0 -T ref.fa input.cram chrM chr1:100-400 chr2:51-55 chrX:770-777"
compare = "sam"

[[case]]
name = "view-cram-multi-region-vs-samtools"
input = { file = "xtask/diff/inputs/aln/many.multi.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/index/many-multi/input.multi.cram.crai"]
gloci = "gloci view -O sam input.multi.cram --reference ref.fa chrM chr1:100-400 chr2:51-55 chrX:770-777"
reference = "samtools view -h --no-PG --input-fmt-option decode_md=0 -T ref.fa input.multi.cram chrM chr1:100-400 chr2:51-55 chrX:770-777"
compare = "sam"

[[case]]
name = "view-cram-region-past-end-vs-samtools"
input = { file = "xtask/diff/inputs/aln/pastend.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/index/pastend/input.cram.crai"]
gloci = "gloci view -O sam input.cram --reference ref.fa chr1:1001-1010"
reference = "samtools view -h --no-PG --input-fmt-option decode_md=0 -T ref.fa input.cram chr1:1001-1010"
compare = "sam"

# htslib keeps CRAM's internal `cF` tag to itself, so samtools prints none (even one a read
# carried in): gloci strips it.
[[case]]
name = "view-cram-cf-tag-vs-samtools"
input = { file = "xtask/diff/inputs/aln/cf.noref.cram" }
gloci = "gloci view -O sam input.noref.cram"
reference = "samtools view -h --no-PG --input-fmt-option decode_md=0 input.noref.cram"
compare = "sam"

# A region that starts past the end of its reference (#region-past-reference-end): the BAM's
# index finds the reads that run past the end (samtools too, see
# view-bam-region-past-end-vs-samtools), the CRAM's does not (view-cram-region-past-end-vs-samtools).
# The reference reads the BAM twin of the CRAM gloci reads.
[[case]]
name = "view-cram-region-past-end-vs-bam-samtools"
input = { file = "xtask/diff/inputs/aln/pastend.bam" }
aux = ["xtask/diff/inputs/aln/pastend.bam.bai", "xtask/diff/inputs/aln/pastend.cram", "xtask/diff/inputs/aln/pastend.cram.crai", "xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai"]
gloci = "gloci view -O sam --no-header pastend.cram --reference ref.fa chr1:1001-1010"
reference = "samtools view --no-PG -X input.bam pastend.bam.bai chr1:1001-1010"
compare = "exact"
expected_difference = "#region-past-reference-end"

# A damaged container of the reads with no place (#cram-unplaced-tail): streamed (-t 1) gloci
# fails on it, an indexed run at -t 4 never reads it. The reference is gloci itself at -t 1.
[[case]]
name = "genomecov-cram-unplaced-tail-t4-vs-t1"
input = { file = "xtask/diff/inputs/aln/many.badtail.cram" }
aux = ["xtask/diff/inputs/fa/ref.fa", "xtask/diff/inputs/fa/ref.fa.fai", "xtask/diff/inputs/aln/index/badtail/input.badtail.cram.crai"]
gloci = "gloci genomecov input.badtail.cram --reference ref.fa -t 4"
reference = "gloci genomecov input.badtail.cram --reference ref.fa -t 1"
compare = "exit-status"
expected_difference = "#cram-unplaced-tail"
