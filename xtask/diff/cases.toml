# P3c Task 6
# `depth` (D137, D138) against samtools 1.21. depth.bam sets the traps: a deletion whose next base
# has quality 10 (-J -q 20 differs if the gate is the previous base), a 100 bp `N`, soft clips,
# insertions, `=`/`X`, a mapped read with CIGAR `*` (samtools reads it as unmapped), QUAL `*`
# (passes -q 50), MAPQ 29 and 30 (-Q 30 keeps 30), duplicate, secondary, QC-fail and
# supplementary reads (only the supplementary one counts by default), a placed unmapped read
# (prints a 0 row with --exclude-flags 0), proper-pair reads, reads of 30 (after clips), 49 and
# 50 bases (-l 50 keeps 50), and an empty chr3 (only -aa prints it). `-g DUP` and `-G
# SUPPLEMENTARY` are samtools' way to write this command's --exclude-flags. The index of the
# region and per-chromosome cases is `input.bai`, the name samtools and gloci find beside
