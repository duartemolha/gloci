compare = "numeric"
expected_difference = "#coverage-point"

# With --split A's length is the sum of its blocks; bedtools divides by A's whole span.
[[case]]
name = "coverage-split-vs-bedtools"
input = { file = "xtask/diff/inputs/cov-split-a.bed" }
aux = ["xtask/diff/inputs/cov-split-b.bed"]
