# P3b Task 22: vcf annotate vs bcftools annotate --no-version (1.21)
# file.vcf: two samples; C>T,G and two C>G at 1:200, an indel, a deletion, reordered ALTs at 1:450,
# existing Number=A tags. src.vcf, ann.tab, pos.tab, regions.* hold what to transfer.
# The reference needs bgzipped, indexed inputs for a VCF or positional tab source; gloci reads them plain.

# Transfers from a VCF source pair on a shared allele. file.vcf has C>T,G, C>G and a duplicate C>G
# at 1:200 against the source's C>G,T and C>G: the exact pair is written first, then the partial
# pair, then the duplicate, as the synced reader orders them; 1:300 A>AT does not pair with the
# source's A>T.
[[case]]
name = "vcf-annotate-vcf-id-qual-filter-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/annotate/file.vcf" }
aux = ["xtask/diff/inputs/vcf/annotate/src.vcf"]
gloci = "gloci vcf annotate input.vcf -a src.vcf -c ID,QUAL,FILTER"
reference = "bgzip -c input.vcf > f.vcf.gz && tabix -p vcf f.vcf.gz && bgzip -c src.vcf > s.vcf.gz && tabix -p vcf s.vcf.gz && bcftools annotate --no-version -a s.vcf.gz -c ID,QUAL,FILTER f.vcf.gz"
compare = "vcf-records"

[[case]]
name = "vcf-annotate-vcf-info-all-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/annotate/file.vcf" }
aux = ["xtask/diff/inputs/vcf/annotate/src.vcf"]
gloci = "gloci vcf annotate input.vcf -a src.vcf -c INFO"
reference = "bgzip -c input.vcf > f.vcf.gz && tabix -p vcf f.vcf.gz && bgzip -c src.vcf > s.vcf.gz && tabix -p vcf s.vcf.gz && bcftools annotate --no-version -a s.vcf.gz -c INFO f.vcf.gz"
compare = "vcf-records"

# A flag the source record lacks is removed from the paired record (1:200 keeps no DB), as bcftools
# does.
[[case]]
name = "vcf-annotate-vcf-info-tags-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/annotate/file.vcf" }
aux = ["xtask/diff/inputs/vcf/annotate/src.vcf"]
gloci = "gloci vcf annotate input.vcf -a src.vcf -c INFO/AF,INFO/DB,INFO/NAME,INFO/DP"
reference = "bgzip -c input.vcf > f.vcf.gz && tabix -p vcf f.vcf.gz && bgzip -c src.vcf > s.vcf.gz && tabix -p vcf s.vcf.gz && bcftools annotate --no-version -a s.vcf.gz -c INFO/AF,INFO/DB,INFO/NAME,INFO/DP f.vcf.gz"
compare = "vcf-records"

