# convert of alignments (D106) against bedtools 2.31.1 bamtobed. cigars.bam has one read per
# CIGAR shape (clips, H, I, =/X, N, D, a reverse read; cigars-bases.bam is it without the
# all-clip read, which bedtools writes zero-length: the pinned cases keep it); flags.bam has mates (/1, /2), MAPQ 0 and 10, unmapped reads and every filter flag;
# order.bam has start ties on five contigs in the order chrM, chr1, chr2, chr10, chrX; tags.bam
# has one read with AS:i:-5 and reads without NM. SAM input has no bedtools reader: the
# reference converts it with samtools first.
