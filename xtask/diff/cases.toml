name = "view-sam-normalised-unmapped-vs-samtools"
input = { file = "xtask/diff/inputs/aln/normalised.sam" }
gloci = "gloci view -O sam --require-flags unmap input.sam"
reference = "samtools view -h --no-PG -f 4 input.sam"
compare = "sam"

[[case]]
name = "view-sam-normalised-mate-vs-samtools"
input = { file = "xtask/diff/inputs/aln/normalised.sam" }
gloci = "gloci view -O sam --exclude-flags unmap input.sam"
reference = "samtools view -h --no-PG -F 4 input.sam"
compare = "sam"

# Records that BAM cannot hold are fine in SAM: a CIGAR of 70,000 operations over 2^28
# reference bases, PNEXT and TLEN of 3,000,000,000.
[[case]]
name = "view-sam-not-bam-representable-to-sam-vs-samtools"
input = { file = "xtask/diff/inputs/aln/not-bam.sam" }
gloci = "gloci view -O sam input.sam"
reference = "samtools view -h --no-PG input.sam"
compare = "sam"

