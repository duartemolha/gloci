# dup.vcf repeats sample A1: it is renamed 2:A1 (the number of its file), D9 is new.
[[case]]
name = "vcf-merge-force-samples-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/dup.vcf", "xtask/diff/inputs/vcf/merge/b.vcf"]
gloci = "gloci vcf merge input.vcf dup.vcf b.vcf --force-samples"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c dup.vcf > dup.vcf.gz && bcftools index dup.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bcftools merge --no-version --force-samples input.vcf.gz dup.vcf.gz b.vcf.gz"
compare = "vcf-records"

# A repeated sample name stops both (exit 1); --force-samples is the way on.
[[case]]
name = "vcf-merge-duplicate-samples-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/dup.vcf"]
gloci = "gloci vcf merge input.vcf dup.vcf"
reference = "(bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c dup.vcf > dup.vcf.gz && bcftools index dup.vcf.gz && bcftools merge --no-version input.vcf.gz dup.vcf.gz) >/dev/null 2>&1 || exit 1"
compare = "exit-status"

# User rules: max, avg (integer division by the records that have the tag), sum of a Number=A
# Float, join of a String; AC and AN are then not recalculated.
[[case]]
name = "vcf-merge-info-rules-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf -i DP:max,DP4:avg,AF:sum,NAME:join,AC:max"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -i DP:max,DP4:avg,AF:sum,NAME:join,AC:max input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

# -i - drops the default DP:sum,DP4:sum: DP and DP4 keep the first record's value; AC and AN
# are still recalculated from the merged genotypes.
[[case]]
name = "vcf-merge-info-rules-off-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf -i -"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -i - input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

# -f PASS skips, before pairing, every record whose FILTER does not list PASS.
[[case]]
name = "vcf-merge-apply-filters-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf -f PASS"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -f PASS input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

[[case]]
name = "vcf-merge-apply-filters-missing-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf -f PASS,."
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -f PASS,. input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

# -F x: an input with no filter (PASS or .) makes the result PASS; otherwise the filters are united.
[[case]]
name = "vcf-merge-filter-logic-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf c.vcf -F x"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -F x input.vcf.gz b.vcf.gz c.vcf.gz"
compare = "vcf-records"

# Header union: first file's lines, then the new contig, INFO, FILTER and ALT lines of the second; a
# repeated ID keeps the first definition (a different Number or description is ignored); a
# generic key already present is not added again.
[[case]]
name = "vcf-merge-header-union-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/k1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/k2.vcf"]
