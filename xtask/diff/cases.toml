compare = "exact"

# P3c Task 8
# `bedcov` (D140) against samtools 1.21. bedcov.bed sets the traps: lines out of order with 3 to 6
# columns (echoed as they are, so a column dropped or reordered shows), one CRLF line (samtools
# strips the CR), `#`, `track` and blank lines, a zero-length region inside a read and two on its
# edges (samtools counts no read for any zero-length region), regions only over an intron (chr1
# 100-150) and only over a deletion (44-47), overlapping regions (ov1, ov2), a whole reference, an empty
# chr3, the placed unmapped read at chr1:175, and one region that runs past chr2's LN (300). With
# no -d, samtools counts D and N bases in the sum, as gloci does; with -d it drops both from both
# columns, so `-d` alone is pinned and the matching cases use `-j`. `--split` alone and
# `--split-deletions` alone have no samtools flag: the reference is `-j` over a copy of depth.bam
# whose D (or N) operations are rewritten to M, with SEQ and QUAL `*` so the lengths need not
# agree. The index is depth.bam.bai, beside depth.bam. depth-pastend.bam has reads that run past
# chr2's LN. Zero-length regions never read the index.

[[case]]
name = "bedcov-default-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam"
reference = "samtools bedcov input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-read-count-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --read-count"
reference = "samtools bedcov -c input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-split-both-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --split --split-deletions"
reference = "samtools bedcov -j input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-split-alone-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --split"
reference = '''set -e; samtools view -h depth.bam | awk 'BEGIN{OFS="\t"} /^@/{print;next} {gsub(/D/,"M",$6); $10="*"; $11="*"; print}' | samtools view -b -o t.bam -; samtools index t.bam; samtools bedcov -j input.bed t.bam'''
compare = "exact"

[[case]]
name = "bedcov-split-deletions-alone-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --split-deletions"
reference = '''set -e; samtools view -h depth.bam | awk 'BEGIN{OFS="\t"} /^@/{print;next} {gsub(/N/,"M",$6); $10="*"; $11="*"; print}' | samtools view -b -o t.bam -; samtools index t.bam; samtools bedcov -j input.bed t.bam'''
compare = "exact"

[[case]]
name = "bedcov-bases-at-depth-split-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --bases-at-depth 2 --split --split-deletions"
reference = "samtools bedcov -d 2 -j input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-min-mapq-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --min-mapq 30 --read-count"
reference = "samtools bedcov -Q 30 -c input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-exclude-flags-dup-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --exclude-flags UNMAP,SECONDARY,QCFAIL --read-count"
reference = "samtools bedcov -g DUP -c input.bed depth.bam"
compare = "exact"

[[case]]
name = "bedcov-two-files-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai", "xtask/diff/inputs/samtools/depth2.bam", "xtask/diff/inputs/samtools/depth2.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam depth2.bam --column-names --read-count --bases-at-depth 1 --split --split-deletions"
reference = "samtools bedcov -H -c -d 1 -j input.bed depth.bam depth2.bam"
compare = "exact"

[[case]]
name = "bedcov-cram-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.cram", "xtask/diff/inputs/samtools/depth.cram.crai"]
gloci = "gloci bedcov input.bed depth.cram --read-count"
reference = "set -e; samtools view -b -o t.bam depth.cram; samtools index t.bam; samtools bedcov -c input.bed t.bam"
compare = "exact"

# `-d` alone: samtools leaves D and N bases out of both columns; gloci keeps what --split and
# --split-deletions say.

[[case]]
name = "bedcov-depth-threshold-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --bases-at-depth 2"
reference = "samtools bedcov -d 2 input.bed depth.bam"
compare = "exact"
expected_difference = "#bedcov-depth-threshold"

# A chromosome the files lack (line 9): samtools reports it and exits 2, gloci exits 1.

[[case]]
name = "bedcov-bad-chrom-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov-badchrom.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam"
reference = "samtools bedcov input.bed depth.bam"
compare = "exit-status"
expected_difference = "#bedcov-bad-line"

# Reads that run past chr2's LN: samtools counts the bases beyond it.

[[case]]
name = "bedcov-past-reference-end-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth-pastend.bam", "xtask/diff/inputs/samtools/depth-pastend.bam.bai"]
gloci = "gloci bedcov input.bed depth-pastend.bam"
reference = "samtools bedcov input.bed depth-pastend.bam"
compare = "exact"
expected_difference = "#depth-past-reference-end"

# --exclude-flags 0 is samtools -g 0x704: duplicate, secondary and QC-fail reads count, and the
# placed unmapped read still does not.
[[case]]
name = "bedcov-exclude-flags-zero-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/bedcov.bed" }
aux = ["xtask/diff/inputs/samtools/depth.bam", "xtask/diff/inputs/samtools/depth.bam.bai"]
gloci = "gloci bedcov input.bed depth.bam --exclude-flags 0 --read-count"
reference = "samtools bedcov -g 0x704 -c input.bed depth.bam"
compare = "exact"
# P3c Task 11: `reheader` (D130). reheader-in.bam has three references of different lengths
# (chr1 1000, chr2 2000, chr3 3000) and a read on each, so a swapped order shows in the LNs.
# new-header.sam renames them to 1, 2, 3, appends a fourth @SQ and changes the @RG; the BAM
# header file new-header.bam holds the same header. samtools runs with -P (no @PG); the `bam` and
# `cram` modes ignore gloci's own @PG line.
[[case]]
name = "reheader-bam-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/reheader-in.bam" }
aux = ["xtask/diff/inputs/samtools/new-header.sam"]
gloci = "gloci reheader new-header.sam input.bam"
reference = "samtools reheader -P new-header.sam input.bam"
compare = "bam"

[[case]]
name = "reheader-bam-header-file-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/reheader-in.bam" }
aux = ["xtask/diff/inputs/samtools/new-header.bam"]
gloci = "gloci reheader new-header.bam input.bam"
reference = "samtools reheader -P new-header.bam input.bam"
compare = "bam"

# P3a's embed_ref CRAM (chr1 1000, chr2 1234, with M5): the new header repeats the M5s, renames
# the references, adds a third @SQ and changes the @RG. gloci writes a new header container and
# copies the data containers; the compare mode decodes both.
[[case]]
name = "reheader-cram-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.embed.cram" }
aux = ["xtask/diff/inputs/samtools/new-header-cram.sam"]
gloci = "gloci reheader new-header-cram.sam input.embed.cram"
reference = "samtools reheader -P new-header-cram.sam input.embed.cram"
compare = "cram"

# bad-ln.sam changes chr2's LN and bad-order.sam swaps chr2 and chr3: samtools writes the file,
# gloci exits 1.
[[case]]
name = "reheader-bad-ln-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/reheader-in.bam" }
aux = ["xtask/diff/inputs/samtools/bad-ln.sam"]
gloci = "gloci reheader bad-ln.sam input.bam"
reference = "samtools reheader -P bad-ln.sam input.bam"
compare = "exit-status"
expected_difference = "#reheader-sq-check"

[[case]]
name = "reheader-bad-order-vs-samtools"
input = { file = "xtask/diff/inputs/samtools/reheader-in.bam" }
aux = ["xtask/diff/inputs/samtools/bad-order.sam"]
gloci = "gloci reheader bad-order.sam input.bam"
reference = "samtools reheader -P bad-order.sam input.bam"
compare = "exit-status"
expected_difference = "#reheader-sq-check"

# P3c Task 12: `view --count` (samtools `view -c`) and `--regions-file` on alignments (samtools
# `-L`), D133. The reads are aln/flags.bam's; gloci reads input.bam unindexed (it scans), and
# samtools is given the .bai where positional regions need one. targets.bed holds zero-length
# regions on the edges of and inside the reads at chr1:101, overlapping regions, the placed
# unmapped read and a chr2 region (see make-samtools.sh).
[[case]]
name = "view-count-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
gloci = "gloci view --count input.bam"
reference = "samtools view -c input.bam"
compare = "exact"

[[case]]
name = "view-count-regions-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
aux = ["xtask/diff/inputs/aln/flags.bam.bai"]
gloci = "gloci view --count input.bam chr1:1-150 chr2:95-105"
reference = "samtools view -c -X input.bam flags.bam.bai chr1:1-150 chr2:95-105"
compare = "exact"

[[case]]
name = "view-count-filters-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
gloci = "gloci view --count --exclude-flags UNMAP,SECONDARY input.bam"
reference = "samtools view -c -F 0x104 input.bam"
compare = "exact"

[[case]]
name = "view-regions-file-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
aux = ["xtask/diff/inputs/samtools/view-targets.bed"]
gloci = "gloci view -O sam --no-header --regions-file view-targets.bed input.bam"
reference = "samtools view --no-PG -L view-targets.bed input.bam"
compare = "sam"

[[case]]
name = "view-count-regions-file-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
aux = ["xtask/diff/inputs/samtools/view-targets.bed"]
gloci = "gloci view --count --regions-file view-targets.bed input.bam"
reference = "samtools view -c -L view-targets.bed input.bam"
compare = "exact"

# Pinned (#view-overlapping-regions): chr1:101-110 matches both regions; samtools writes it twice.
[[case]]
name = "view-count-overlapping-regions-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
aux = ["xtask/diff/inputs/aln/flags.bam.bai"]
gloci = "gloci view --count input.bam chr1:1-150 chr1:100-200"
reference = "samtools view -c -X input.bam flags.bam.bai chr1:1-150 chr1:100-200"
compare = "exact"
expected_difference = "#view-overlapping-regions"

# Pinned (#view-regions-union): view-targets.bed also covers chr2; samtools keeps only the chr1 reads
# that are in view-targets.bed, gloci counts all of chr1 plus view-targets.bed's chr2 reads.
[[case]]
name = "view-count-regions-union-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flags.bam" }
aux = ["xtask/diff/inputs/aln/flags.bam.bai", "xtask/diff/inputs/samtools/view-targets.bed"]
gloci = "gloci view --count input.bam chr1 --regions-file view-targets.bed"
reference = "samtools view -c -X -L view-targets.bed input.bam flags.bam.bai chr1"
compare = "exact"
expected_difference = "#view-regions-union"
