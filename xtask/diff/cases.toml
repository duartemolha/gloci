# bedtools adds B's two ends in a 32-bit int, so a B midpoint past 2^31 wraps negative; gloci
# does not (docs/differences.md#reldist-midpoint-overflow). The reference output is from aarch64,
# where the signed overflow wraps; the golden pins that it differs, and a gloci-only test pins
# gloci's own numbers.
