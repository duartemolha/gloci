[[case]]
name = "coverage-point-default-vs-bedtools"
input = { file = "xtask/diff/inputs/cov-points-a.bed" }
aux = ["xtask/diff/inputs/cov-points-b.bed"]
gloci = "gloci coverage --chrom-order lex -a input.bed -b cov-points-b.bed"
reference = "bedtools coverage -a input.bed -b cov-points-b.bed"
compare = "numeric"
expected_difference = "#coverage-point"

[[case]]
name = "coverage-point-hist-vs-bedtools"
input = { file = "xtask/diff/inputs/cov-points-a.bed" }
aux = ["xtask/diff/inputs/cov-points-b.bed"]
gloci = "gloci coverage --chrom-order lex -a input.bed -b cov-points-b.bed --hist"
reference = "bedtools coverage -a input.bed -b cov-points-b.bed -hist"
compare = "numeric"
expected_difference = "#coverage-point"

