# FASTA indexes (D108). gloci's .fai/.gzi must be usable by samtools and equal
# its own; the committed fixtures pin the same byte equality in plain cargo test
# (crates/gloci-io/tests/fasta.rs `fai_matches_samtools`).

[[case]]
name = "index-interop-faidx"
input = { file = "xtask/diff/inputs/fa/ref.fa" }
gloci = '''set -e; gloci index input.fa; cat input.fa.fai; samtools faidx input.fa chr1:5-70 chr2:1000-1100 chr10:1-600 chrX:51-70 chrM:1-4'''
reference = '''set -e; samtools faidx input.fa; cat input.fa.fai; samtools faidx input.fa chr1:5-70 chr2:1000-1100 chr10:1-600 chrX:51-70 chrM:1-4'''
compare = "exact"

# chr2 of this file spans five BGZF blocks; the second query straddles the
# boundary of the first two (uncompressed byte 65239).
[[case]]
name = "index-interop-faidx-bgzf"
input = { file = "xtask/diff/inputs/fa/ref.fa.gz" }
gloci = '''set -e; gloci index input.fa.gz; cat input.fa.gz.fai; od -An -tx1 input.fa.gz.gzi; samtools faidx input.fa.gz chr1:5-70 chr2:60000-60100 chr2:62990-63020 chr2:299000-300000 chrX:1-777'''
reference = '''set -e; samtools faidx input.fa.gz; cat input.fa.gz.fai; od -An -tx1 input.fa.gz.gzi; samtools faidx input.fa.gz chr1:5-70 chr2:60000-60100 chr2:62990-63020 chr2:299000-300000 chrX:1-777'''
compare = "exact"

