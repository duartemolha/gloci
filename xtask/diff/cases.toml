# Multi-allelic records: bcftools `-c none` pairs records with the same
# position and identical allele lists; the cases here have identical lists
# (match) or lists with nothing in common (no match) so gloci agrees.
[[case]]
name = "intersect-alleles-multiallelic-vs-bcftools"
