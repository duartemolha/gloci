expected_difference = "#vcf-merge-undeclared-info"
# P3b Task 2: stats jaccard vs bedtools jaccard 2.31.1
# jaccard-a.bed: 10-20 and 20-30 are bookended and must merge before counting (3 raw A records,
# 2 merged: n_intersections 2, not 3). jaccard-a6/b6.bed: + and - A records overlap each other.
# jaccard-fa/fb.bed: merged A is 0-20 (0-12 and 10-20), so -f 0.5 and -r give other answers than
# the unmerged records would. -S is not compared: bedtools jaccard -S takes a + or - argument.

[[case]]
name = "stats-jaccard-table-vs-bedtools"
input = { file = "xtask/diff/inputs/p3b/stats/jaccard-a.bed" }
aux = ["xtask/diff/inputs/p3b/stats/jaccard-b.bed"]
gloci = "gloci stats jaccard --chrom-order lex -a input.bed -b jaccard-b.bed"
reference = "bedtools jaccard -a input.bed -b jaccard-b.bed"
compare = "exact"

[[case]]
name = "stats-jaccard-strand-vs-bedtools"
