name = "subtract-difference-merged-vs-bedops"
input = { file = "xtask/diff/inputs/rel-a.bed" }
aux = ["xtask/diff/inputs/rel-b.bed", "xtask/diff/inputs/rel-a-merged.bed"]
gloci = "gloci subtract --chrom-order lex -a rel-a-merged.bed -b rel-b.bed"
reference = "bedops --difference input.bed rel-b.bed"
compare = "exact"

