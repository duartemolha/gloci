# vcf compare (Task 15/16, D163) vs vcftools 0.1.16 --diff-site-discordance,
# --diff-indv-discordance and --diff-discordance-matrix. vcftools pairs sites
# by position, so gloci runs --match position. Each statistic is compared
# through its output file (`&& cat`), so these run live only; plain `cargo test`
# pins the same files through crates/gloci/tests/vcf_compare.rs against the
# committed vcftools outputs in crates/gloci-vcf/tests/golden/compare. vcftools
# prints a 0/0 ratio as nan or -nan by CPU: the reference side maps -nan to nan.

[[case]]
name = "vcf-compare-site-vs-vcftools"
input = { file = "crates/gloci-vcf/tests/golden/compare/a.vcf" }
aux = ["crates/gloci-vcf/tests/golden/compare/b.vcf"]
gloci = "gloci vcf compare input.vcf b.vcf --match position --out-prefix o && cat o.diff.sites"
reference = "vcftools --vcf input.vcf --diff b.vcf --diff-site-discordance --out o >/dev/null 2>&1 && cat o.diff.sites | sed 's/-nan/nan/'"
compare = "exact"

[[case]]
