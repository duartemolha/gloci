compare = "exact"

[[case]]
name = "closest-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed -s --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed -s -d"
compare = "exact"

[[case]]
name = "closest-opposite-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed -S --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed -S -d"
compare = "exact"

[[case]]
name = "closest-per-file-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed", "xtask/diff/inputs/closest-b2.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed closest-b2.bed --names 1,2 --per-file --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed closest-b2.bed -mdb each -d"
compare = "exact"

[[case]]
name = "closest-per-file-k2-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed", "xtask/diff/inputs/closest-b2.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed closest-b2.bed --names 1,2 --per-file -k 2 --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed closest-b2.bed -mdb each -k 2 -d"
compare = "exact"

# bedops closest-features writes `|` between columns: a live shell case, plus a
# golden-able twin whose reference output is `|` already translated to tabs.

[[case]]
name = "closest-each-side-vs-bedops"
input = { file = "xtask/diff/inputs/closest-fa.bed" }
aux = ["xtask/diff/inputs/closest-fb.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-fb.bed --each-side --distance --ignore-overlaps"
reference = "closest-features --dist --no-overlaps input.bed closest-fb.bed | tr '|' '\t'"
compare = "exact"

[[case]]
name = "closest-each-side-nodist-vs-bedops"
input = { file = "xtask/diff/inputs/closest-fa.bed" }
aux = ["xtask/diff/inputs/closest-fb.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-fb.bed --each-side --ignore-overlaps"
reference = "closest-features --no-overlaps input.bed closest-fb.bed | tr '|' '\t'"
compare = "exact"

# gloci counts an overlapping B on both sides, bedops gives it precedence on
# one side and reports the nearest non-overlapping B on the other.
[[case]]
name = "closest-each-side-overlap-vs-bedops"
input = { file = "xtask/diff/inputs/closest-fa.bed" }
aux = ["xtask/diff/inputs/closest-fb.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-fb.bed --each-side --distance"
reference = "closest-features --dist input.bed closest-fb.bed | tr '|' '\t'"
compare = "exact"
expected_difference = "#closest-each-side"

# A missing side is the D45 placeholder here, `NA` in bedops.
[[case]]
name = "closest-each-side-missing-vs-bedops"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-fb.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-fb.bed --each-side --distance --ignore-overlaps"
reference = "closest-features --dist --no-overlaps input.bed closest-fb.bed | tr '|' '\t'"
compare = "exact"
expected_difference = "#closest-each-side"

# `-k 2 -t first`: bedtools collapses the ties of every distance and counts
# distinct distances (a3: the 501 pair gives one row, then 721); gloci cuts
# only the ties at the k-th distance.
[[case]]
name = "closest-k2-ties-first-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed -k 2 --ties first --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed -k 2 -t first -d"
compare = "exact"
expected_difference = "#closest-ties-k"

# A on a chromosome only the second file has: bedtools writes no row for the
# file without a candidate, and gloci does the same (a file with no candidate
# writes nothing; all files empty gives one placeholder row).
[[case]]
name = "closest-per-file-missing-chrom-vs-bedtools"
input = { file = "xtask/diff/inputs/closest-pf-a.bed" }
aux = ["xtask/diff/inputs/closest-b.bed", "xtask/diff/inputs/closest-b2.bed"]
gloci = "gloci closest --chrom-order lex -a input.bed -b closest-b.bed closest-b2.bed --names 1,2 --per-file --distance"
reference = "bedtools closest -a input.bed -b closest-b.bed closest-b2.bed -mdb each -d"
compare = "exact"
