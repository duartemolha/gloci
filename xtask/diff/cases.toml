aux = ["xtask/diff/inputs/aln/cat-d.bam"]
gloci = "gloci cat input.bam cat-d.bam"
reference = "samtools cat --no-PG input.bam cat-d.bam"
compare = "exit-status"
expected_difference = "#alignment-cat-sq"

