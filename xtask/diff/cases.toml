aux = ["xtask/diff/inputs/rel-b.bed"]
gloci = "gloci merge --chrom-order lex input.bed | gloci subtract --chrom-order lex -a - -b rel-b.bed"
reference = "bedops --difference input.bed rel-b.bed"
compare = "exact"

# Golden-able twin of the case above: rel-a-merged.bed is rel-a.bed after
