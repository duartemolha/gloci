name = "stats-reldist-midpoint-overflow-vs-bedtools"
input = { file = "xtask/diff/inputs/p3b/stats/reldist-ov-a.bed" }
aux = ["xtask/diff/inputs/p3b/stats/reldist-ov-b.bed"]
gloci = "gloci stats reldist --detail -a input.bed -b reldist-ov-b.bed"
reference = "bedtools reldist -detail -a input.bed -b reldist-ov-b.bed"
compare = "exact"
expected_difference = "#reldist-midpoint-overflow"

