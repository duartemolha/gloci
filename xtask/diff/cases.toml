reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c k2.vcf > k2.vcf.gz && bcftools index k2.vcf.gz && bcftools merge --no-version input.vcf.gz k2.vcf.gz"
compare = "vcf-records"

# Absent samples take the ploidy of the widest GT in the record: . where every input is haploid,
# ./. next to a diploid, ././. next to a triploid.
[[case]]
name = "vcf-merge-haploid-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/h1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/h2.vcf", "xtask/diff/inputs/vcf/merge/h3.vcf"]
gloci = "gloci vcf merge input.vcf h2.vcf h3.vcf"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c h2.vcf > h2.vcf.gz && bcftools index h2.vcf.gz && bgzip -c h3.vcf > h3.vcf.gz && bcftools index h3.vcf.gz && bcftools merge --no-version input.vcf.gz h2.vcf.gz h3.vcf.gz"
compare = "vcf-records"

[[case]]
name = "vcf-merge-haploid-missing-to-ref-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/h1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/h2.vcf", "xtask/diff/inputs/vcf/merge/h3.vcf"]
