name = "genomecov-ibam-default-vs-bedtools"
input = { file = "xtask/diff/inputs/aln/cigars-bases.bam" }
gloci = "gloci genomecov input.bam --bga"
reference = "bedtools genomecov -ibam input.bam -bga"
