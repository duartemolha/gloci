name = "coverage-split-hist-vs-bedtools"
input = { file = "xtask/diff/inputs/cov-split-a.bed" }
aux = ["xtask/diff/inputs/cov-split-b.bed"]
gloci = "gloci coverage --chrom-order lex -a input.bed -b cov-split-b.bed --split --hist"
reference = "bedtools coverage -a input.bed -b cov-split-b.bed -split -hist"
compare = "numeric"
expected_difference = "#coverage-split-length"

# `bedtools coverage -d -split` ignores -split (A and B are whole spans, offsets
# run along A's span); gloci --per-base --split walks A's blocks.
[[case]]
name = "coverage-split-per-base-vs-bedtools"
input = { file = "xtask/diff/inputs/cov-split-a.bed" }
aux = ["xtask/diff/inputs/cov-split-b.bed"]
gloci = "gloci coverage --chrom-order lex -a input.bed -b cov-split-b.bed --split --per-base"
reference = "bedtools coverage -a input.bed -b cov-split-b.bed -split -d"
compare = "numeric"
expected_difference = "#coverage-split-length"

# complement (Task 16): comp-in.bed is sorted in comp.genome order (chr1, chr2,
# chr10, chrX, chrM) and has overlapping, nested and bookended features, a
# feature starting at 0 and a chromosome (chrM) without features.
[[case]]
name = "complement-genome-vs-bedtools"
input = { file = "xtask/diff/inputs/comp-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci complement -g comp.genome input.bed"
reference = "bedtools complement -i input.bed -g comp.genome"
compare = "exact"

# Without a genome both tools report only the gaps between features of one
# chromosome (no leading or trailing gap).
[[case]]
name = "complement-vs-bedops"
input = { file = "xtask/diff/inputs/merge-in.bed" }
gloci = "gloci complement --chrom-order lex input.bed"
reference = "bedops --complement input.bed"
compare = "exact"

# complement edge cases. A point covers no bases (D48): bedtools complement
# splits the gap around it into [.., p-1) and [p+1, ..), as if it were a base.
[[case]]
name = "complement-point-vs-bedtools"
input = { file = "xtask/diff/inputs/comp-point.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci complement -g comp.genome input.bed"
reference = "bedtools complement -i input.bed -g comp.genome"
compare = "exact"
expected_difference = "#complement-points"

[[case]]
name = "complement-point-vs-bedops"
input = { file = "xtask/diff/inputs/comp-point-lex.bed" }
gloci = "gloci complement --chrom-order lex input.bed"
reference = "bedops --complement input.bed"
compare = "exact"
expected_difference = "#complement-points"

# A feature past the end of its chromosome: bedtools warns and carries on,
# gloci exits 1.
[[case]]
name = "complement-past-end-vs-bedtools"
input = { file = "xtask/diff/inputs/comp-past.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci complement -g comp.genome input.bed"
reference = "bedtools complement -i input.bed -g comp.genome"
compare = "exit-status"
expected_difference = "#complement-past-end"

# A chromosome that is not in the genome: both tools exit 1.
[[case]]
name = "complement-missing-chrom-vs-bedtools"
input = { file = "xtask/diff/inputs/comp-missing.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci complement -g comp.genome input.bed"
reference = "bedtools complement -i input.bed -g comp.genome"
compare = "exit-status"

# slop and flank (Task 17). transform-in.bed has features at 0, at the end of
# their chromosome, a minus strand and an unknown strand; both tools
# need the genome (comp.genome). transform-in.gff3 is the GFF counterpart.
[[case]]
name = "slop-both-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -b 10"
compare = "exact"

[[case]]
name = "slop-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop --left 5 --right 20 -s -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -l 5 -r 20 -s"
compare = "exact"

[[case]]
name = "slop-pct-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop --pct -b 0.1 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -pct -b 0.1"
compare = "exact"

[[case]]
name = "slop-gff-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.gff3" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.gff3"
reference = "bedtools slop -i input.gff3 -g comp.genome -b 10"
compare = "exact"

[[case]]
name = "flank-both-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank -b 10 -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -b 10"
compare = "exact"

[[case]]
name = "flank-left-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-stranded.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank --left 5 -s -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -l 5 -r 0 -s"
compare = "exact"

[[case]]
name = "flank-gff-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.gff3" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank -b 10 -g comp.genome input.gff3"
reference = "bedtools flank -i input.gff3 -g comp.genome -b 10"
compare = "exact"

# bedtools needs -l and -r together (or -b); gloci takes either alone.
[[case]]
name = "flank-one-side-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank --left 5 -s -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -l 5 -s"
compare = "exit-status"
expected_difference = "#slop-flank-one-side"

[[case]]
name = "slop-one-side-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop --right 5 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -r 5"
compare = "exit-status"
expected_difference = "#slop-flank-one-side"

# A point: slop agrees; bedtools flank treats it as the single base at 1-based
# position `start` and leaves a base between the point and each strip.
[[case]]
name = "slop-point-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-point.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -b 10"
compare = "exact"

[[case]]
name = "flank-point-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-point.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank -b 10 -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -b 10"
compare = "exact"
expected_difference = "#flank-points"

# A feature that straddles the chromosome end is clipped by both tools.
[[case]]
name = "slop-straddle-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-straddle.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -b 10"
compare = "exact"

[[case]]
name = "flank-straddle-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-straddle.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank -b 10 -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -b 10"
compare = "exact"

# A feature wholly beyond the chromosome end: bedtools writes a 1-base slop
# at the end (slop) or an unclipped strip (flank); gloci exits 1.
[[case]]
name = "slop-past-end-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-past.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -b 10"
compare = "exit-status"
expected_difference = "#slop-flank-past-end"

[[case]]
name = "flank-past-end-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-past.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank -b 10 -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -b 10"
compare = "exit-status"
expected_difference = "#slop-flank-past-end"

# A chromosome that is not in the genome: both tools exit 1.
[[case]]
name = "slop-missing-chrom-vs-bedtools"
input = { file = "xtask/diff/inputs/comp-missing.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci slop -b 10 -g comp.genome input.bed"
reference = "bedtools slop -i input.bed -g comp.genome -b 10"
compare = "exit-status"

# flank -s on a record of unknown strand: bedtools writes nothing for it,
# gloci treats it as `+` (D49). slop -s agrees (slop-strand-vs-bedtools).
[[case]]
name = "flank-unknown-strand-vs-bedtools"
input = { file = "xtask/diff/inputs/transform-in.bed" }
aux = ["xtask/diff/inputs/comp.genome"]
gloci = "gloci flank --left 5 --right 5 -s -g comp.genome input.bed"
reference = "bedtools flank -i input.bed -g comp.genome -l 5 -r 5 -s"
compare = "exact"
expected_difference = "#flank-unknown-strand"

# windows (Task 18). comp.genome gives lengths that do not divide evenly.
# windows-in.bed is unsorted, has extra columns, a 3 bp interval (skipped by
# -n 4 in both tools) and a feature that covers a whole chromosome.
[[case]]
name = "windows-size-step-vs-bedtools"
input = { file = "xtask/diff/inputs/comp.genome" }
gloci = "gloci windows -g input.genome -w 300 --step 200"
reference = "bedtools makewindows -g input.genome -w 300 -s 200"
compare = "exact"

# A step larger than the size leaves gaps in both tools.
[[case]]
name = "windows-step-gaps-vs-bedtools"
input = { file = "xtask/diff/inputs/comp.genome" }
gloci = "gloci windows -g input.genome -w 100 --step 250"
reference = "bedtools makewindows -g input.genome -w 100 -s 250"
compare = "exact"

[[case]]
name = "windows-count-vs-bedtools"
input = { file = "xtask/diff/inputs/comp.genome" }
gloci = "gloci windows -g input.genome -n 3"
reference = "bedtools makewindows -g input.genome -n 3"
compare = "exact"

[[case]]
name = "windows-intervals-id-vs-bedtools"
input = { file = "xtask/diff/inputs/windows-in.bed" }
gloci = "gloci windows -i input.bed -w 100 --id-column"
reference = "bedtools makewindows -b input.bed -w 100 -i winnum"
compare = "exact"

[[case]]
name = "windows-intervals-count-reverse-vs-bedtools"
input = { file = "xtask/diff/inputs/windows-in.bed" }
gloci = "gloci windows -i input.bed -n 4 --id-column --reverse"
reference = "bedtools makewindows -b input.bed -n 4 -i winnum -reverse"
compare = "exact"

[[case]]
name = "windows-step-reverse-vs-bedtools"
input = { file = "xtask/diff/inputs/windows-in.bed" }
gloci = "gloci windows -i input.bed -w 40 --step 30 --id-column --reverse"
reference = "bedtools makewindows -b input.bed -w 40 -s 30 -i winnum -reverse"
compare = "exact"

# bedtools reads a point (start == end) as the single base at 1-based
# position `start` and windows [start - 1, start + 1); gloci gives none.
[[case]]
name = "windows-point-vs-bedtools"
input = { file = "xtask/diff/inputs/windows-point.bed" }
gloci = "gloci windows -i input.bed -w 4"
reference = "bedtools makewindows -b input.bed -w 4"
compare = "exact"
expected_difference = "#windows-points"

# bedops --chop cuts each input line, so overlapping input has to be merged
# first: a live pipeline, plus a golden-able twin on a pre-merged file.
[[case]]
name = "windows-chop-pipeline-vs-bedops"
input = { file = "xtask/diff/inputs/merge-in.bed" }
gloci = "gloci merge --chrom-order lex input.bed | gloci windows -i - -w 100"
reference = "bedops -m input.bed | bedops --chop 100 -"
compare = "exact"

[[case]]
name = "windows-chop-vs-bedops"
input = { file = "xtask/diff/inputs/windows-merged.bed" }
gloci = "gloci windows -i input.bed -w 100"
reference = "bedops --chop 100 input.bed"
compare = "exact"

[[case]]
name = "windows-zero-length-chromosome-vs-bedtools"
input = { file = "xtask/diff/inputs/windows-zero.genome" }
gloci = "gloci windows -g input.genome -w 100"
reference = "bedtools makewindows -g input.genome -w 100"
compare = "exit-status"
expected_difference = "#windows-zero-length-chromosome"

# convert (Task 19). vcf2bed writes ID, QUAL, REF, ALT, FILTER, INFO after the
# coordinates; the awk in the reference puts them in gloci's order (ID, REF,
# ALT, QUAL, FILTER) and drops INFO. vcf2bed also writes one row per ALT and
# spans each variant its own way, so most of these inputs are single-ALT.
# bedops gff2bed leaves the name column "." for GFF3.

[[case]]
name = "convert-vcf-ref-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-snv-ins.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"

[[case]]
name = "convert-vcf-ref-coordinates-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-snv-ins.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref | cut -f1-3"
reference = "vcf2bed < input.vcf | cut -f1-3"
compare = "exact"

# Without --deletions vcf2bed gives a deletion its single anchor base.
[[case]]
name = "convert-vcf-ref-deletions-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"
expected_difference = "#vcf2bed-variant-spans"

[[case]]
name = "convert-vcf-snvs-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref --types snv"
reference = "vcf2bed --snvs < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"

[[case]]
name = "convert-vcf-insertions-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref --types ins"
reference = "vcf2bed --insertions < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"

[[case]]
name = "convert-vcf-deletions-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref --types del"
reference = "vcf2bed --deletions < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"

[[case]]
name = "convert-vcf-deletions-coordinates-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref --types del | cut -f1-3"
reference = "vcf2bed --deletions < input.vcf | cut -f1-3"
compare = "exact"

# The default allele span starts a deletion after its anchor base.
[[case]]
name = "convert-vcf-allele-span-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-simple.vcf" }
gloci = "gloci convert input.vcf"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"
expected_difference = "#vcf-allele-span"

# One row per ALT: a multi-allelic SNV record matches vcf2bed with
# --split-alleles, and differs without it. vcf2bed sorts the rows of one
# position by their text, gloci keeps ALT order, so the rows are compared
# as a set.
[[case]]
name = "convert-vcf-split-alleles-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-multi-snv.vcf" }
gloci = "gloci convert input.vcf --split-alleles"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "lines-unordered"

[[case]]
name = "convert-vcf-multiallelic-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-multi-snv.vcf" }
gloci = "gloci convert input.vcf"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"
expected_difference = "#convert-multiallelic-rows"

# --split-alleles gives each ALT its allele footprint, vcf2bed only the
# anchor base of the REF.
[[case]]
name = "convert-vcf-split-deletions-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-multi-del.vcf" }
gloci = "gloci convert input.vcf --split-alleles"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"
expected_difference = "#vcf-allele-span"

# vcf2bed spans an MNV with one base and a symbolic or breakend ALT with
# its anchor base, and counts a complex REF/ALT pair by its lengths.
[[case]]
name = "convert-vcf-spans-vs-vcf2bed"
input = { file = "xtask/diff/inputs/convert-spans.vcf" }
gloci = "gloci convert input.vcf --vcf-span ref"
reference = "vcf2bed < input.vcf | awk -F'\\t' -v OFS='\\t' '{print $1,$2,$3,$4,$6,$7,$5,$8}'"
compare = "exact"
expected_difference = "#vcf2bed-variant-spans"

[[case]]
name = "convert-vcf-types-del-vs-vcf2bed"
