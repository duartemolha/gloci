# genomecov on alignments (D105, D117) against bedtools 2.31.1 `genomecov -ibam`. gloci counts the
# reference span of a read, deletions included (bedtools -ignoreD, gloci's default); `-split`
# cuts at N and D, which is `--split-deletions`; `-split -ignoreD` cuts at N only, which is
# `--split`. Plain `-ibam` cuts at D but not at N, which no gloci option reproduces. The
# chromosomes and sizes come from the header, with no -g.

