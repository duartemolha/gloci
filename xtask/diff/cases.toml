gloci = "gloci vcf merge input.vcf type-b.vcf"
reference = "(bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c type-b.vcf > type-b.vcf.gz && bcftools index type-b.vcf.gz && bcftools merge --no-version input.vcf.gz type-b.vcf.gz) >/dev/null 2>&1 || exit 1"
compare = "exit-status"
expected_difference = "#vcf-merge-conflicting-types"

# A record uses an INFO tag no header declares: bcftools stops (exit 255), gloci writes it.
[[case]]
