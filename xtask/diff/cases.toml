compare = "vcf-records"

# Without samples AC and AN (and DP, DP4) are summed per allele; R and AF are re-indexed, a Flag and
# a String come from the first record.
[[case]]
name = "vcf-merge-sites-only-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/s1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/s2.vcf"]
gloci = "gloci vcf merge input.vcf s2.vcf"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c s2.vcf > s2.vcf.gz && bcftools index s2.vcf.gz && bcftools merge --no-version input.vcf.gz s2.vcf.gz"
compare = "vcf-records"

# Without samples and without rules AC and AN are dropped.
[[case]]
name = "vcf-merge-sites-only-rules-off-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/s1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/s2.vcf"]
gloci = "gloci vcf merge input.vcf s2.vcf -i -"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c s2.vcf > s2.vcf.gz && bcftools index s2.vcf.gz && bcftools merge --no-version -i - input.vcf.gz s2.vcf.gz"
compare = "vcf-records"

# join of a Number=A or R tag would make it Number=.; here max and min work per allele.
[[case]]
name = "vcf-merge-sites-only-rules-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/s1.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/s2.vcf"]
gloci = "gloci vcf merge input.vcf s2.vcf -i AC:max,AN:min,DP:avg,S:join,R:max,AF:min"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c s2.vcf > s2.vcf.gz && bcftools index s2.vcf.gz && bcftools merge --no-version -i AC:max,AN:min,DP:avg,S:join,R:max,AF:min input.vcf.gz s2.vcf.gz"
compare = "vcf-records"

# A PL with the wrong number of values (4 for two alleles) stops both: exit 1.
[[case]]
name = "vcf-merge-bad-pl-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/badpl-a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/badpl-b.vcf"]
gloci = "gloci vcf merge input.vcf badpl-b.vcf"
reference = "(bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c badpl-b.vcf > badpl-b.vcf.gz && bcftools index badpl-b.vcf.gz && bcftools merge --no-version input.vcf.gz badpl-b.vcf.gz) >/dev/null 2>&1 || exit 1"
compare = "exit-status"

# --file-list FILE (bcftools -l) reads the input names from a file.
[[case]]
name = "vcf-merge-file-list-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf", "xtask/diff/inputs/vcf/merge/list.txt"]
gloci = "gloci vcf merge --file-list list.txt"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && printf 'input.vcf.gz\nb.vcf.gz\nc.vcf.gz\n' > l.txt && bcftools merge --no-version -l l.txt"
compare = "vcf-records"

# BCF inputs; gloci writes the text records with -O vcf (its output keeps the inputs' format).
[[case]]
name = "vcf-merge-bcf-inputs-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "set -e; gloci view -O bcf input.vcf -o a.bcf; gloci view -O bcf b.vcf -o b.bcf; gloci view -O bcf c.vcf -o c.bcf; gloci vcf merge a.bcf b.bcf c.bcf -O vcf"
reference = "set -e; bcftools view -Ob -o a.bcf input.vcf; bcftools view -Ob -o b.bcf b.vcf; bcftools view -Ob -o c.bcf c.vcf; bcftools index a.bcf; bcftools index b.bcf; bcftools index c.bcf; bcftools merge --no-version a.bcf b.bcf c.bcf"
compare = "vcf-records"

# BCF output read back as text.
[[case]]
name = "vcf-merge-bcf-output-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf", "xtask/diff/inputs/vcf/merge/c.vcf"]
gloci = "set -e; gloci vcf merge input.vcf b.vcf c.vcf -o m.bcf; gloci view m.bcf -O vcf"
reference = "bgzip -c input.vcf > input.vcf.gz && bcftools index input.vcf.gz && bgzip -c b.vcf > b.vcf.gz && bcftools index b.vcf.gz && bgzip -c c.vcf > c.vcf.gz && bcftools index c.vcf.gz && bcftools merge --no-version -Ob -o m.bcf input.vcf.gz b.vcf.gz c.vcf.gz && bcftools view m.bcf"
compare = "vcf-records"

# bcftools merge needs bgzipped, indexed files; gloci merges plain sorted ones as a stream.
[[case]]
name = "vcf-merge-plain-files-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/b.vcf"]
gloci = "gloci vcf merge input.vcf b.vcf"
reference = "bcftools merge --no-version input.vcf b.vcf >/dev/null 2>&1 || exit 1"
compare = "exit-status"
expected_difference = "#vcf-merge-no-index"

# One file with several records at a position (samepos-a: A>AC and A>DEL; samepos-c: A>AT,C and A>DEL):
# bcftools merges the <DEL> of two files first, then A>AC; the order is its own can_merge/stage_line.
[[case]]
name = "vcf-merge-same-position-vs-bcftools"
input = { file = "xtask/diff/inputs/vcf/merge/samepos-a.vcf" }
aux = ["xtask/diff/inputs/vcf/merge/samepos-b.vcf", "xtask/diff/inputs/vcf/merge/samepos-c.vcf"]
