input = { file = "xtask/diff/inputs/aln/not-bam.sam" }
gloci = "gloci view -O bam input.sam"
reference = "samtools view -b --no-PG input.sam"
compare = "exit-status"

# A FLAG with a sign: both refuse it.
[[case]]
name = "view-sam-flag-plus-vs-samtools"
input = { file = "xtask/diff/inputs/aln/flag-plus.sam" }
gloci = "gloci view -O bam input.sam"
reference = "samtools view -b --no-PG input.sam"
compare = "exit-status"

# A @PG line with no ID: samtools cannot add its own @PG line, so it fails the run; gloci
