input = { file = "xtask/diff/inputs/groupby.bed" }
gloci = "gloci groupby input.bed -g 1 -c 5:sum,5:mean,5:stdev_pop"
reference = "bedtools groupby -i input.bed -g 1 -c 5,5,5 -o sum,mean,stdev"
compare = "numeric"

[[case]]
name = "groupby-text-key-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby.bed" }
gloci = "gloci groupby input.bed -g 6,1 -c 5:sum,5:count"
reference = "bedtools groupby -i input.bed -g 6,1 -c 5,5 -o sum,count"
compare = "numeric"

[[case]]
name = "groupby-multi-ops-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby.bed" }
gloci = "gloci groupby input.bed -g 1 -c 4:collapse,4:distinct_sorted,4:count,4:count_distinct,5:median,5:mode,5:antimode,5:min,5:max,4:first,4:last"
reference = "bedtools groupby -i input.bed -g 1 -c 4,4,4,4,5,5,5,5,5,4,4 -o collapse,distinct,count,count_distinct,median,mode,antimode,min,max,first,last"
compare = "numeric"

# bedtools sorts `distinct`; gloci keeps first-seen order (`distinct_sorted` is the bedtools list).
[[case]]
name = "groupby-distinct-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby.bed" }
gloci = "gloci groupby input.bed -g 1 -c 4:distinct"
reference = "bedtools groupby -i input.bed -g 1 -c 4 -o distinct"
compare = "exact"
expected_difference = "#map-distinct-order"

# bedtools -header copies the input header; gloci writes the key names and the -c labels.
[[case]]
name = "groupby-header-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby-header.tsv" }
gloci = "gloci groupby input.tsv --header -g 1 -c 4:sum"
reference = "bedtools groupby -i input.tsv -header -g 1 -c 4 -o sum"
compare = "exact"
expected_difference = "#groupby-header"

# bedtools reports a missing column and exits 0 after partial output; gloci exits 1.
[[case]]
name = "groupby-missing-column-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby-short.tsv" }
gloci = "gloci groupby input.tsv -g 2 -c 1:count"
reference = "bedtools groupby -i input.tsv -g 2 -c 1 -o count"
compare = "exit-status"
expected_difference = "#groupby-missing-column"

# A `-c` column past the end of a line is an error in gloci; bedtools groupby reports it and exits 0.
[[case]]
name = "groupby-absent-column-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby-absent.tsv" }
gloci = "gloci groupby input.tsv -g 1 -c 2:sum"
reference = "bedtools groupby -i input.tsv -g 1 -c 2 -o sum"
compare = "exit-status"
expected_difference = "#groupby-missing-column"

# bedtools map rejects a B file whose lines differ in width (ragged B); gloci rejects the line that lacks the column. Both fail.
[[case]]
name = "map-absent-column-vs-bedtools"
input = { file = "xtask/diff/inputs/map-ragged-a.bed" }
aux = ["xtask/diff/inputs/map-ragged-b.bed"]
gloci = "gloci map --chrom-order lex -a input.bed -b map-ragged-b.bed -c 5:sum"
reference = "bedtools map -a input.bed -b map-ragged-b.bed -c 5 -o sum"
compare = "exit-status"

# A uniform B that lacks the requested column: bedtools prints a warning and exits 0; gloci exits 1.
[[case]]
name = "map-uniform-absent-column-vs-bedtools"
input = { file = "xtask/diff/inputs/map-uniform-a.bed" }
aux = ["xtask/diff/inputs/map-uniform-b.bed"]
gloci = "gloci map -a input.bed -b map-uniform-b.bed -c 5:sum"
reference = "bedtools map -a input.bed -b map-uniform-b.bed -c 5 -o sum"
compare = "exit-status"
expected_difference = "#groupby-missing-column"

# merge -c on lines that all lack the column: bedtools prints a warning and exits 0; gloci exits 1.
[[case]]
name = "merge-uniform-absent-column-vs-bedtools"
input = { file = "xtask/diff/inputs/map-uniform-b.bed" }
gloci = "gloci merge input.bed -c 5:sum"
reference = "bedtools merge -i input.bed -c 5 -o sum"
compare = "exit-status"
expected_difference = "#groupby-missing-column"

# A value that is not a number: bedtools warns, skips it and exits 0; gloci stops with the line.
[[case]]
name = "groupby-non-numeric-vs-bedtools"
input = { file = "xtask/diff/inputs/groupby-nonnum.tsv" }
