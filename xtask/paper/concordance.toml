reference = "vcftools --gzvcf {in_a} --get-INFO AF --get-INFO AC --stdout > {out}"
expected_difference = "#vcf-extract-info"

# The same table without gloci's ID column (#vcf-extract-info), so the values
# are compared.
[[case]]
name = "vcf-extract-info-no-id-1kg-vs-vcftools"
command = "vcf extract"
reference_tool = "vcftools"
inputs = { a = "1kg-30x-chr20" }
gloci = "{gloci} vcf extract {in_a} --info AF,AC | cut -f 1,2,4- > {out}"
reference = "vcftools --gzvcf {in_a} --get-INFO AF --get-INFO AC --stdout > {out}"
expected_difference = "#vcf-allele-case"

# The first 100 samples of the header, the same list on both sides. No
# expected_difference: #vcf-extract-012 (haploid and half-missing calls) is
# pinned by a live diff case only, not a golden, and chr20 of this panel has
# neither kind of call.
[[case]]
name = "vcf-extract-012-1kg-vs-vcftools"
command = "vcf extract"
reference_tool = "vcftools"
inputs = { a = "1kg-30x-chr20" }
gloci = '''tabix -H {in_a} | tail -n 1 | cut -f 10-109 | tr '\t' '\n' > {out}.samples && {gloci} vcf extract {in_a} --samples-file {out}.samples --genotype-matrix 012 --out-prefix {out}.p && cat {out}.p.012 {out}.p.012.indv {out}.p.012.pos > {out}'''
reference = '''tabix -H {in_a} | tail -n 1 | cut -f 10-109 | tr '\t' '\n' > {out}.samples && vcftools --gzvcf {in_a} --keep {out}.samples --012 --out {out}.p && cat {out}.p.012 {out}.p.012.indv {out}.p.012.pos > {out}'''

[[case]]
name = "vcf-concat-1kg-halves-vs-bcftools"
