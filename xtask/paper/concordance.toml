reference_tool = "bcftools"
inputs = { a = "1kg-chr20.p1.vcf.gz", b = "1kg-chr20.p2.vcf.gz" }
gloci = "{gloci} vcf concat {in_a} {in_b} -O vcf | bgzip -@ 2 -l 1 -c > {out}"
reference = "bcftools concat --no-version {in_a} {in_b} | bgzip -@ 2 -l 1 -c > {out}"
compare = "vcf-records"

