# ---- map: CTCF fold change (B, bedGraph) over cCREs (A) ----

# bedtools map rounds to 5 significant digits unless -prec: -prec 17 prints
# the double whole.
[[case]]
name = "map-ccre-signal-vs-bedtools"
command = "map"
reference_tool = "bedtools"
inputs = { a = "ccre.bed", b = "ctcf-fc.bedgraph" }
gloci = "{gloci} map -a {in_a} -b {in_b} -c 4:mean -c 4:max -c 4:count > {out}"
reference = "bedtools map -a {in_a} -b {in_b} -c 4,4,4 -o mean,max,count -prec 17 > {out}"
compare = "numeric"

# bedmap scores come from column 5, so the bedGraph value is moved there
# (a process substitution: bedmap stops reading the map file after the last
# cCRE chromosome, which would fail a pipe under pipefail). bedmap's default
# 6 decimals are kept: its running sums drift (a mean of one 0 prints as
# 0.00000000102 with --prec 17), and the numeric compare allows for the
# decimals each side prints.
[[case]]
name = "map-ccre-signal-vs-bedmap"
command = "map"
reference_tool = "bedops"
inputs = { a = "ccre.bed", b = "ctcf-fc.bedgraph" }
gloci = "{gloci} map -a {in_a} -b {in_b} -c 4:mean > {out}"
reference = '''bedmap --echo --mean {in_a} <(awk 'BEGIN{OFS="\t"}{print $1,$2,$3,".",$4}' {in_b}) | tr '|' '\t' > {out}'''
compare = "numeric"
compat = "--empty NAN"
expected_difference = "#map-empty-value"

