# Real-data concordance (D97): `cargo xtask paper run --concordance-only`.
#
# Each case runs `reference` once and `gloci` once per mode in the bench image
# (gloci-bench:p1, tools pinned there) with the paper dataset cache mounted
# read-only at /cache. Commands are bash (`-o pipefail`, LC_ALL=C) and write
# their result to {out}; gzip output (bgzip) is read back decompressed.
# {in_a}, {in_b}, {in_c} and {genome} are the `inputs` (datasets and derived
# inputs of xtask/bench/datasets.toml).
#
# - Default mode: the runner adds `--chrom-order lex` after every gloci
#   subcommand that takes it, as the derived inputs are sorted with LC_ALL=C.
#   Do not write it here.
# - Compat mode (cases with `compat`): the same plus the `compat` flags after
#   the first gloci subcommand, against the same reference output.
# - `compare`: `exact` (lines), `numeric` (numbers agree within the decimals
#   the less precise side printed, or a relative 1e-5) or `vcf-records` (`#`
#   lines skipped). Lines are matched as multisets and the order is checked
#   too.
# - `expected_difference` / `compat_difference`: the documented difference
#   (docs/differences.md) the default / compat run may show. A run that
#   differs without one fails; an anchor that never fires prints
#   `anchor unused`.
#
# Reference commands and compat flags copy the diff case of the same command
# (xtask/diff/cases.toml). Changes for real data, each noted where it is made:
# `-prec 17` where bedtools map and groupby round to 5 significant digits, output piped through bgzip where it is gigabytes, and inputs
# reshaped where a tool reads another column layout.

# ---- sort ----

[[case]]
name = "sort-exons-vs-sort-bed"
command = "sort"
reference_tool = "sort-bed"
inputs = { a = "exons-unsorted.bed" }
gloci = "{gloci} sort {in_a} > {out}"
reference = "sort-bed {in_a} > {out}"
compat = "--full-key"
expected_difference = "#sort-tie-order"

[[case]]
name = "sort-exons-vs-bedtools-sort"
command = "sort"
reference_tool = "bedtools"
inputs = { a = "exons-unsorted.bed" }
gloci = "{gloci} sort {in_a} > {out}"
reference = "bedtools sort -i {in_a} > {out}"
expected_difference = "#sort-tie-order"

