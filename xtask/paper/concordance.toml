# ---- partition: cCREs, exons and CTCF peaks ----

# bedops needs sort-bed order (start, then end), which the derived inputs
# (sorted by start, stable) do not have where records share a start; on them
# bedops --partition writes segments whose end is before their start.
[[case]]
name = "partition-ccre-exons-peaks-vs-bedops"
command = "partition"
reference_tool = "bedops"
inputs = { a = "ccre.bed", b = "exons.bed", c = "ctcf-peaks.bed" }
gloci = "{gloci} partition --no-membership {in_a} {in_b} {in_c} > {out}"
reference = "bedops --partition <(sort-bed {in_a}) <(sort-bed {in_b}) <(sort-bed {in_c}) > {out}"

# multiinter reshaped to its first five columns, as in the diff cases.
[[case]]
name = "partition-ccre-exons-peaks-vs-multiinter"
command = "partition"
reference_tool = "bedtools"
inputs = { a = "ccre.bed", b = "exons.bed", c = "ctcf-peaks.bed" }
gloci = "{gloci} partition --names 1,2,3 {in_a} {in_b} {in_c} > {out}"
reference = "bedtools multiinter -i {in_a} {in_b} {in_c} | cut -f1-5 > {out}"
compat = "--merge-adjacent"
expected_difference = "#partition-boundaries"

