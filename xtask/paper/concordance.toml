# GTF order: the exons of a gene are consecutive, so each run is one gene.
# bedtools groupby rounds to 5 significant digits unless -prec.
[[case]]
name = "groupby-genes-exons-unsorted-vs-bedtools"
command = "groupby"
reference_tool = "bedtools"
inputs = { a = "exons-unsorted.bed" }
gloci = "{gloci} groupby {in_a} -g 1,4,6 -c 2:min,3:max,4:count,3:mean > {out}"
reference = "bedtools groupby -i {in_a} -g 1,4,6 -c 2,3,4,3 -o min,max,count,mean -prec 17 > {out}"
compare = "numeric"

# ---- convert ----

# gtf2bed sorts its output unless --do-not-sort, and gloci convert keeps the
# input order (#convert-input-order), so the records are compared in GTF order.
# GTF rows are named by gene_id on both sides (#gff2bed-name is GFF3 only).
[[case]]
name = "convert-gencode-gtf-vs-gtf2bed"
command = "convert"
reference_tool = "bedops"
inputs = { a = "gencode-v46-gtf" }
gloci = "{gloci} convert {in_a} > {out}"
reference = "zcat {in_a} | gtf2bed --do-not-sort > {out}"
expected_difference = "#gff2bed-zero-length"

