# ---- VCF against BED: 1000 Genomes chr20 (A) and exons (B) ----

# The VCF's ##contig lines (chr1, chr2, ...) take precedence over
# --chrom-order, so exons.bed (chr1, chr10, ...) would be unsorted against
# them; -g with the LC_ALL=C genome puts both in one order. bedtools reads B
# into memory (no -sorted).
[[case]]
name = "intersect-1kg-exons-vs-bedtools"
command = "intersect"
reference_tool = "bedtools"
inputs = { a = "1kg-30x-chr20", b = "exons.bed", genome = "hg38.lex.genome" }
gloci = "{gloci} intersect --mode any -g {genome} -a {in_a} -b {in_b} | bgzip -@ 2 -l 1 -c > {out}"
reference = "bedtools intersect -u -header -a {in_a} -b {in_b} | bgzip -@ 2 -l 1 -c > {out}"
compare = "vcf-records"
compat = "--vcf-span ref"
expected_difference = "#vcf-allele-span"

# Ten regions of chr20 in order, apart from each other.
[[case]]
name = "view-1kg-regions-vs-tabix"
command = "view"
reference_tool = "tabix"
inputs = { a = "1kg-30x-chr20" }
gloci = "{gloci} view --no-header {in_a} chr20:1000000-1010000 chr20:5000000-5005000 chr20:10000000-10002000 chr20:15000000-15010000 chr20:20000000-20001000 chr20:25000000-25050000 chr20:32000000-32005000 chr20:40000000-40010000 chr20:50000000-50005000 chr20:60000000-60010000 > {out}"
reference = "tabix {in_a} chr20:1000000-1010000 chr20:5000000-5005000 chr20:10000000-10002000 chr20:15000000-15010000 chr20:20000000-20001000 chr20:25000000-25050000 chr20:32000000-32005000 chr20:40000000-40010000 chr20:50000000-50005000 chr20:60000000-60010000 > {out}"
compat = "--vcf-span ref --inclusive-points"
expected_difference = "#view-region-footprints"

# ---- vcf filter ----

# vcftools --max-missing 0.9 (fraction called) is gloci --max-missing 0.1.
# The panel has no multi-allelic site, so #maf-multiallelic cannot show; its
# mobile-element SVs (<DEL:ME:SINE|Alu|AluSx1>) show #vcf-allele-case.
[[case]]
name = "vcf-filter-maf-missing-1kg-vs-vcftools"
command = "vcf filter"
reference_tool = "vcftools"
inputs = { a = "1kg-30x-chr20" }
gloci = "{gloci} vcf filter {in_a} --min-maf 0.01 --max-missing 0.1 -O vcf | bgzip -@ 2 -l 1 -c > {out}"
reference = "vcftools --gzvcf {in_a} --recode --recode-INFO-all --stdout --maf 0.01 --max-missing 0.9 | bgzip -@ 2 -l 1 -c > {out}"
compare = "vcf-records"
expected_difference = "#vcf-allele-case"

[[case]]
name = "vcf-filter-pass-only-gnomad-vs-vcftools"
command = "vcf filter"
reference_tool = "vcftools"
inputs = { a = "gnomad-v4.1-exomes-chr22" }
gloci = "{gloci} vcf filter {in_a} --pass-only -O vcf | bgzip -@ 2 -l 1 -c > {out}"
reference = "vcftools --gzvcf {in_a} --recode --recode-INFO-all --stdout --remove-filtered-all | bgzip -@ 2 -l 1 -c > {out}"
compare = "vcf-records"

# --pass-only keeps FILTER PASS and `.`, which is bcftools -f .,PASS. bcftools
# prints every record again, with gnomAD's floats shortened (#vcf-filter-values).
[[case]]
name = "vcf-filter-pass-only-gnomad-vs-bcftools"
command = "vcf filter"
reference_tool = "bcftools"
inputs = { a = "gnomad-v4.1-exomes-chr22" }
gloci = "{gloci} vcf filter {in_a} --pass-only -O vcf | bgzip -@ 2 -l 1 -c > {out}"
reference = "bcftools view --no-version -f .,PASS {in_a} | bgzip -@ 2 -l 1 -c > {out}"
compare = "vcf-records"
expected_difference = "#vcf-filter-values"

[[case]]
name = "vcf-filter-include-1kg-vs-bcftools"
command = "vcf filter"
reference_tool = "bcftools"
inputs = { a = "1kg-30x-chr20" }
gloci = '''{gloci} vcf filter {in_a} --include 'INFO/AF>0.05 && TYPE="snp"' -O vcf | bgzip -@ 2 -l 1 -c > {out}'''
reference = '''bcftools view --no-version -i 'INFO/AF>0.05 && TYPE="snp"' {in_a} | bgzip -@ 2 -l 1 -c > {out}'''
compare = "vcf-records"
expected_difference = "#expr-subset"

# ---- vcf stats: one vcftools run per statistic ----
# vcftools upper-cases the alleles it prints (#vcf-allele-case), which the
# panel's mobile-element SVs show in the --freq and --counts allele columns
# (none of them is a singleton or doubleton).

[[case]]
name = "vcf-stats-freq-1kg-vs-vcftools"
command = "vcf stats"
reference_tool = "vcftools"
