[[case]]
name = "vcf-filter-1kg-chr20"
dataset = "1kg-30x-chr20"
input = "vcf.gz"
targets = ["gloci <= 0.2 * vcftools"]
[case.commands]
gloci = "{gloci} vcf filter --min-maf 0.01 --max-missing 0.1 {in} -o {out}"
vcftools = "vcftools --gzvcf {in} --maf 0.01 --max-missing 0.9 --recode --recode-INFO-all --stdout | bgzip -@ 8 > {out}"
bcftools = "bcftools view -i 'MAF>=0.01 && F_MISSING<=0.1' {in} -Oz -o {out}"
vcfkit = "vk filter --maf 0.01 --missing 0.1 {in} | bgzip -@ 8 > {out}"
vcfexpress = "vcfexpress filter --expr 'maf >= 0.01 && missing <= 0.1' {in} -o {out}"

[[case]]
name = "vcf-filter-synthetic-2500"
setup = "vcf --records 50000 --samples 2500 --seed 1 --chroms 1"
input = "vcf.gz"
targets = ["gloci <= 0.2 * vcftools"]
[case.commands]
gloci = "{gloci} vcf filter --min-maf 0.01 --max-missing 0.1 --min-qual 30 {in} -o {out}"
vcftools = "vcftools --gzvcf {in} --maf 0.01 --max-missing 0.9 --minQ 30 --recode --recode-INFO-all --stdout | bgzip -@ 8 > {out}"
bcftools = "bcftools view -i 'MAF>=0.01 && F_MISSING<=0.1 && QUAL>=30' {in} -Oz -o {out}"
vcfkit = "vk filter --maf 0.01 --missing 0.1 --min-qual 30 {in} | bgzip -@ 8 > {out}"
vcfexpress = "vcfexpress filter --expr 'maf >= 0.01 && missing <= 0.1 && qual >= 30' {in} -o {out}"

# ---- P2 cases ----
# genomecov and shift need a genome: the synthetic chromosomes are chr1..chr24
# of 250,000,000 bases (gen.rs CHROM_LEN), written in lexical order beside the
# output. The `{gloci}` word starts the gloci command line wherever it sits.

[[case]]
name = "partition-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= bedops"]
[case.commands]
gloci = "{gloci} partition --chrom-order lex -t 1 --no-membership {in} > {out}"
bedops = "bedops --partition {in} > {out}"

[[case]]
name = "genomecov-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && {gloci} genomecov --chrom-order lex -t 1 -g {out}.genome {in} > {out}"
bedtools = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && bedtools genomecov -i {in} -g {out}.genome > {out}"

[[case]]
name = "cluster-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} cluster --chrom-order lex -t 1 {in} > {out}"
bedtools = "bedtools cluster -i {in} > {out}"

[[case]]
name = "groupby-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} groupby -g 1 -c 5:sum {in} > {out}"
bedtools = "bedtools groupby -i {in} -g 1 -c 5 -o sum > {out}"

[[case]]
name = "shift-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && {gloci} shift --by 100 -g {out}.genome {in} > {out}"
bedtools = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && bedtools shift -i {in} -g {out}.genome -s 100 > {out}"

# vcf stats with five statistics. The baseline runs vcftools once per
# statistic, in sequence. plink2 is skipped when it is not installed.
[[case]]
name = "vcf-stats-1kg-chr20"
dataset = "1kg-30x-chr20"
input = "vcf.gz"
targets = ["gloci <= 0.1 * vcftools-5runs"]
[case.commands]
gloci = "{gloci} vcf stats {in} --out-prefix {out} --freq --missing-site --missing-indv --het --tstv-summary"
vcftools-5runs = "vcftools --gzvcf {in} --freq --out {out}.v1 && vcftools --gzvcf {in} --missing-site --out {out}.v2 && vcftools --gzvcf {in} --missing-indv --out {out}.v3 && vcftools --gzvcf {in} --het --out {out}.v4 && vcftools --gzvcf {in} --TsTv-summary --out {out}.v5"
bcftools-stats = "bcftools stats -s - {in} > {out}"
plink2 = "plink2 --vcf {in} --freq --missing --het --out {out}.plink"

[[case]]
name = "vcf-stats-synthetic-2500"
setup = "vcf --records 50000 --samples 2500 --seed 1 --chroms 1"
input = "vcf.gz"
targets = ["gloci <= 0.1 * vcftools-5runs"]
[case.commands]
gloci = "{gloci} vcf stats {in} --out-prefix {out} --freq --missing-site --missing-indv --het --tstv-summary"
vcftools-5runs = "vcftools --gzvcf {in} --freq --out {out}.v1 && vcftools --gzvcf {in} --missing-site --out {out}.v2 && vcftools --gzvcf {in} --missing-indv --out {out}.v3 && vcftools --gzvcf {in} --het --out {out}.v4 && vcftools --gzvcf {in} --TsTv-summary --out {out}.v5"
bcftools-stats = "bcftools stats -s - {in} > {out}"
plink2 = "plink2 --vcf {in} --freq --missing --het --out {out}.plink"

# Yardstick only (no target): an expression filter against bcftools.
[[case]]
name = "vcf-filter-include-synthetic-2500"
setup = "vcf --records 50000 --samples 2500 --seed 1 --chroms 1"
input = "vcf.gz"
targets = []
[case.commands]
gloci = "{gloci} vcf filter --include 'QUAL>30 && INFO/DP>20' {in} -o {out}"
bcftools = "bcftools view -i 'QUAL>30 && INFO/DP>20' {in} -Oz -o {out}"

# Tracked since the native GT encoding of Task 3 (+9% user time against the
# old path): VCF to BCF on a multi-sample VCF.
[[case]]
name = "convert-bcf-synthetic-100"
setup = "vcf --records 100000 --samples 100 --seed 1 --chroms 1"
input = "vcf"
targets = []
[case.commands]
gloci = "{gloci} view {in} -O bcf > {out}"
bcftools = "bcftools view {in} -Ob > {out}"

# ---- P3a cases: alignments (BAM, CRAM), FASTA and alignment sort ----
# `sam` setups generate coordinate-sorted single-end reads (10% spliced, 3%
# with a deletion) on a reference of 24 chromosomes at 30x, a BED of target
# windows ({in_b}) and the reference FASTA ({ref}); the generated SAM streams
# into `gloci view`, so no SAM text is stored. Cases with one setup share the
# files. bedtools is binding for its commands; samtools is binding for sort,
# merge and cat (gloci replaces them); mosdepth and `samtools index` are
# yardsticks. samtools -m is per thread: `-@ 8 -m 512M` equals gloci's
# `--max-mem 4G`. `fasta` setups give the FASTA ({in}) and a BED of
# --records intervals of 50 to --len-max bases ({in_b}), with soft-masked and
# N runs; --len-max 1000 keeps the output of getfasta and nuc small enough that
# they time the tools, not the disk.

[[case]]
name = "convert-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} convert -t 1 {in} > {out}"
bedtools = "bedtools bamtobed -i {in} > {out}"

# bedtools genomecov -ibam cuts reads at deletions, gloci --split-deletions.
# mosdepth (-t 8) and gloci -t 8 are yardsticks.
[[case]]
name = "genomecov-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} genomecov -t 1 --bga --split-deletions {in} > {out}"
bedtools = "bedtools genomecov -ibam {in} -bga > {out}"
gloci-t8 = "{gloci} genomecov -t 8 --bga --split-deletions {in} > {out}"
mosdepth = "mosdepth -t 8 {out}.mos {in}"

[[case]]
name = "coverage-bam-targets"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} coverage -t 1 -a {in_b} -b {in} > {out}"
bedtools = "bedtools coverage -sorted -a {in_b} -b {in} > {out}"

[[case]]
name = "intersect-bam-any"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} intersect -t 8 --mode any -a {in} -b {in_b} -o {out}"
bedtools = "bedtools intersect -abam {in} -b {in_b} -u > {out}"

# CRAM: gloci decodes with -t 8, bedtools reads it through htslib.
[[case]]
name = "coverage-cram-targets"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "cram"
targets = ["gloci <= bedtools"]
[case.commands]
gloci = "{gloci} coverage -t 8 --reference {ref} -a {in_b} -b {in} > {out}"
bedtools = "bedtools coverage --cram-ref {ref} -a {in_b} -b {in} > {out}"

[[case]]
name = "getfasta-1M"
setup = "fasta --records 1000000 --chroms 24 --chrom-len 10000000 --len-max 1000 --seed 1"
input = "fa"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} getfasta -t 1 -f {in} {in_b} > {out}"
bedtools = "bedtools getfasta -fi {in} -bed {in_b} > {out}"

[[case]]
name = "nuc-1M"
setup = "fasta --records 1000000 --chroms 24 --chrom-len 10000000 --len-max 1000 --seed 1"
input = "fa"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} nuc -t 1 -f {in} {in_b} > {out}"
bedtools = "bedtools nuc -fi {in} -bed {in_b} > {out}"

# 3 Gbases: 24 chromosomes of 125 Mbases.
[[case]]
name = "maskfasta-3G"
setup = "fasta --records 1000000 --chroms 24 --chrom-len 125000000 --len-max 1000 --seed 1"
input = "fa"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} maskfasta -t 1 --fasta {in} -b {in_b} -o {out}"
bedtools = "bedtools maskfasta -fi {in} -bed {in_b} -fo {out}"

# Yardstick only: gloci index against samtools index (both rewrite the index).
[[case]]
name = "index-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = []
[case.commands]
gloci = "{gloci} index -t 8 {in}"
samtools = "samtools index -@ 8 {in} {out}"

# Shuffled input is unsorted, so it has no index.
[[case]]
name = "sort-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --shuffled --seed 1"
input = "bam"
targets = ["gloci <= samtools"]
[case.commands]
gloci = "{gloci} sort -t 8 --max-mem 4G -o {out} {in}"
samtools = "samtools sort -@ 8 -m 512M -o {out} {in}"

[[case]]
name = "sort-name-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
input = "bam"
targets = ["gloci <= samtools"]
[case.commands]
gloci = "{gloci} sort -n -t 8 --max-mem 4G -o {out} {in}"
samtools = "samtools sort -n -@ 8 -m 512M -o {out} {in}"

# Eight coordinate-sorted BAMs of one reference ({ins}), 50M records in all.
[[case]]
name = "merge-bam-8x"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1 --parts 8"
input = "bam"
targets = ["gloci <= samtools"]
[case.commands]
gloci = "{gloci} sort -m -t 8 -o {out} {ins}"
samtools = "samtools merge -f -@ 8 {out} {ins}"

[[case]]
name = "cat-bam-8x"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1 --parts 8"
input = "bam"
targets = ["gloci <= samtools"]
[case.commands]
gloci = "{gloci} cat -o {out} {ins}"
samtools = "samtools cat -o {out} {ins}"
