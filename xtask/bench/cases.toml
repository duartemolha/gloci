gia = "gia coverage -a {in_a} -b {in_b} > {out}"
bedder = "bedder coverage -a {in_a} -b {in_b} > {out}"
granges = "granges coverage -a {in_a} -b {in_b} > {out}"
bedtk = "bedtk cov {in_a} {in_b} > {out}"
grit-genomics = "grit coverage -a {in_a} -b {in_b} > {out}"

