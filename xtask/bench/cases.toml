[case.commands]
gloci = "{gloci} depth -t 1 {in} > {out}"
samtools = "samtools depth {in} > {out}"
gloci-all = "{gloci} depth -t 1 --all-positions {in} > {out}"
samtools-all = "samtools depth -a {in} > {out}"
mosdepth = "mosdepth -t 8 --fast-mode {out}.mos {in}"

[[case.same]]
tools = ["gloci", "samtools"]

[[case.same]]
tools = ["gloci-all", "samtools-all"]


# depth streams at every -t (D138): threads decode BGZF, so -t 8 must not be
