# Benchmark cases. Every BED gloci command uses --chrom-order lex so that all
# tools produce the same order (VCF commands follow the header's contigs). {gloci}, {in}, {in_a}, {in_b} and {out} are substituted by the runner.
# Targets: NAME (<|<=) [FACTOR *] NAME, over the medians of the named commands.
# runs = N (default 5): timed runs per tool after one warm-up. The I/O-heavy cases (cat,
# maskfasta and the cases that write a sorted BAM) take 10, as their wall clock is noisy.
#
# Before a case is timed the runner checks that its commands agree: each command of a
# [[case.same]] group is run once into its own file, and the first tool's output is compared
# with each of the others' (compare = "exact" by default; see xtask/src/verify.rs for the
# modes). A gloci command or a tool a target names that is in no group says why in
# [case.not_compared]. `cargo xtask bench --verify-only` checks every case and times nothing.
# A command asks for its threads itself (-t N, --threads N, --parallel=N, -@ N): the runner
# sets none. Where a tool has one thread only, or answers another question than gloci's plain
# command (bedops -d, closest-features), a `gloci-<variant>` command does that tool's work
# and is what the target names.

[[case]]
name = "sort-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform"
input = "bed"
targets = ["gloci < sort-bed", "gloci <= 1.5 * gnu-sort"]
[case.commands]
gloci = "{gloci} sort --chrom-order lex -t 8 -o {out} {in}"
sort-bed = "sort-bed --max-mem 2G {in} > {out}"
gnu-sort = "LC_ALL=C sort -k1,1 -k2,2n --parallel=8 -S 2G {in} > {out}"
bedtools = "bedtools sort -i {in} > {out}"

# The same lines; ties in each tool's own order (docs/differences.md#sort-tie-order).
[[case.same]]
tools = ["gloci", "sort-bed", "gnu-sort", "bedtools"]
compare = "unordered"

[[case]]
name = "sort-bgzf-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform"
input = "bed.gz"
targets = ["gloci < sort-bed", "gloci <= 1.5 * gnu-sort"]
[case.commands]
gloci = "{gloci} sort --chrom-order lex -t 8 -o {out} {in}"
sort-bed = "bgzip -dc {in} | sort-bed --max-mem 2G - | bgzip -@ 8 > {out}"
gnu-sort = "bgzip -dc {in} | LC_ALL=C sort -k1,1 -k2,2n --parallel=8 -S 2G | bgzip -@ 8 > {out}"
bedtools = "bedtools sort -i {in} | bgzip -@ 8 > {out}"

[[case.same]]
tools = ["gloci", "sort-bed", "gnu-sort", "bedtools"]
compare = "unordered"

[[case]]
name = "intersect-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools", "gloci <= bedops"]
[case.commands]
gloci = "{gloci} intersect --chrom-order lex -t 1 --mode any -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools intersect -u -sorted -a {in_a} -b {in_b} > {out}"
bedops = "bedops -e 1 {in_a} {in_b} > {out}"
gia = "gia intersect -a {in_a} -b {in_b} > {out}"
bedder = "bedder intersect -a {in_a} -b {in_b} > {out}"
granges = "granges filter --overlap {in_b} {in_a} > {out}"
bedtk = "bedtk flt {in_a} {in_b} > {out}"
grit-genomics = "grit intersect -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools", "bedops"]

[[case]]
name = "merge-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools", "gloci <= bedops"]
[case.commands]
gloci = "{gloci} merge --chrom-order lex -t 1 {in} > {out}"
bedtools = "bedtools merge -i {in} > {out}"
bedops = "bedops -m {in} > {out}"
gia = "gia merge -i {in} > {out}"
bedder = "bedder merge -i {in} > {out}"
granges = "granges merge {in} > {out}"
bedtk = "bedtk cov {in} > {out}"
grit-genomics = "grit merge -i {in} > {out}"

[[case.same]]
tools = ["gloci", "bedtools", "bedops"]

[[case]]
name = "subtract-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools", "gloci-merged <= bedops"]
[case.commands]
gloci = "{gloci} subtract --chrom-order lex -t 1 -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools subtract -sorted -a {in_a} -b {in_b} > {out}"
gloci-merged = "{gloci} merge --chrom-order lex -t 1 {in_a} | {gloci} subtract --chrom-order lex -t 1 -a - -b {in_b} > {out}"
bedops = "bedops -m {in_b} | bedops -d {in_a} - > {out}"
gia = "gia subtract -a {in_a} -b {in_b} > {out}"
bedder = "bedder subtract -a {in_a} -b {in_b} > {out}"
granges = "granges filter --no-overlap {in_b} {in_a} > {out}"
bedtk = "bedtk sub {in_a} {in_b} > {out}"
grit-genomics = "grit subtract -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]

[[case.same]]
tools = ["gloci-merged", "bedops"]

[[case]]
name = "closest-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools", "gloci-each-side <= bedops"]
[case.commands]
gloci = "{gloci} closest --chrom-order lex -t 1 --distance -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools closest -d -a {in_a} -b {in_b} > {out}"
gloci-each-side = "{gloci} closest --chrom-order lex -t 1 --each-side --ties first --distance -a {in_a} -b {in_b} > {out}"
bedops = "closest-features --dist {in_a} {in_b} > {out}"
gia = "gia closest -a {in_a} -b {in_b} > {out}"
bedder = "bedder closest -a {in_a} -b {in_b} > {out}"
granges = "granges nearest -a {in_a} -b {in_b} > {out}"
bedtk = "bedtk closest {in_a} {in_b} > {out}"
grit-genomics = "grit closest -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]

[case.not_compared]
gloci-each-side = "the work of closest-features, not its bytes (docs/differences.md#closest-each-side)"
bedops = "one neighbour on each side, where gloci and bedtools write every tied nearest record"

[[case]]
