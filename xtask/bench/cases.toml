[[case.same]]
tools = ["gloci", "bedtools"]


# B: the pairs of A with each end moved by up to 40 bases, so every pair of A
# has a partner. bedtools pairtopair enforces strand unless -is and gloci
# pair-pair ignores it unless -s, so bedtools gets -is: without it the two
# were not doing the same work (the verify step found it). bedtools writes a
# pair that hits in both orientations twice (docs/differences.md
# #pair-pair-once), so the outputs are compared as distinct lines.

[[case]]
name = "pair-pair-1M"
setup = "bedpe --pairs 1000000 --chroms 24 --inter-frac 0.1 --seed 1 --b-pairs 1000000"
input = "bedpe"
targets = ["gloci <= bedtools"]
[case.commands]
gloci = "{gloci} pair-pair -t 1 -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools pairtopair -is -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]
compare = "distinct"


