# samtools depth is single-threaded (-t 1 is the binding comparison);
# mosdepth -t 8 --fast-mode is the yardstick. --all-positions pairs with -a.

[[case]]
name = "depth-bam-50M"
setup = "sam --records 50000000 --read-len 100 --depth 30 --chroms 24 --spliced-frac 0.1 --seed 1"
