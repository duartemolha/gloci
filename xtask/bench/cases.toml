# ---- Statistics cases: randomness, BEDPE pairs and VCF compare ----
# Statistics and randomness need a genome: the synthetic chromosomes chr1..chr24
# of 250,000,000 bases written in lexical order beside the output, as for
# genomecov. gloci's random, shuffle and sample draw another stream than
# bedtools' (docs/differences.md#rng-stream), so only the time is compared.
# `bedpe` setups write A as BEDPE and B as a jittered copy of it (--b-pairs) or random BED (--b-bed);
# `vcf-pair` writes two VCFs of the same sites whose genotypes differ in
# about 1.3% of the calls. vcf popgen runs on the synthetic VCF of vcf stats.

[[case]]
name = "jaccard-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} stats jaccard --chrom-order lex -t 1 -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools jaccard -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]

[[case]]
name = "fisher-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && {gloci} stats fisher -t 1 -g {out}.genome -a {in_a} -b {in_b} > {out}"
bedtools = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && bedtools fisher -a {in_a} -b {in_b} -g {out}.genome > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]

[[case]]
name = "reldist-plain-10M"
setup = "pair --records 10000000 --depth 2 --seed 1 --chroms 24 --sorted"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} stats reldist --chrom-order lex -t 1 -a {in_a} -b {in_b} > {out}"
bedtools = "bedtools reldist -a {in_a} -b {in_b} > {out}"

[[case.same]]
tools = ["gloci", "bedtools"]


# 1,000,000 of 10,000,000 records, written in input order.

[[case]]
name = "sample-plain-10M"
setup = "bed --records 10000000 --chroms 24 --seed 1 --profile uniform"
input = "bed"
targets = ["gloci <= 0.5 * bedtools"]
[case.commands]
gloci = "{gloci} sample -t 1 --seed 1 -n 1000000 {in} > {out}"
bedtools = "bedtools sample -seed 1 -n 1000000 -i {in} > {out}"

[case.not_compared]
gloci = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"
bedtools = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"


# 10M records moved off a 10M-interval exclude file (the exclude is B of the
# pair: short intervals, a tenth of the genome, so every record finds a place).

[[case]]
name = "shuffle-plain-10M"
setup = "pair --records 10000000 --depth 1 --seed 1 --chroms 24 --len-max 100 --sorted"
input = "bed"
targets = ["gloci <= bedtools"]
[case.commands]
gloci = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && {gloci} shuffle -t 1 --seed 1 -g {out}.genome --exclude {in_b} {in_a} > {out}"
bedtools = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && bedtools shuffle -seed 1 -g {out}.genome -excl {in_b} -i {in_a} > {out}"

[case.not_compared]
gloci = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"
bedtools = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"


# `random` reads no input; the one-record BED only satisfies the runner.

[[case]]
name = "random-10M"
setup = "bed --records 1 --chroms 1 --seed 1"
input = "bed"
targets = ["gloci <= bedtools"]
[case.commands]
gloci = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && {gloci} random -t 1 --seed 1 -g {out}.genome -l 100 -n 10000000 > {out}"
bedtools = "printf 'chr%s\\t250000000\\n' $(seq 1 24 | LC_ALL=C sort) > {out}.genome && bedtools random -seed 1 -g {out}.genome -l 100 -n 10000000 > {out}"

[case.not_compared]
gloci = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"
bedtools = "its own random stream, so other records than the other tool picks (docs/differences.md#rng-stream)"


# A: 1M BEDPE pairs (10% on two chromosomes); B: 10M BED intervals.

[[case]]
name = "pair-intersect-1M-vs-10M"
setup = "bedpe --pairs 1000000 --chroms 24 --inter-frac 0.1 --seed 1 --b-bed 10000000"
