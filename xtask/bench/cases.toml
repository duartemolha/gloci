samtools = "samtools flagstat -@ 0 {in} > {out}"
gloci-t8 = "{gloci} flagstat -t 8 {in} > {out}"
samtools-t8 = "samtools flagstat -@ 7 {in} > {out}"

[[case.same]]
tools = ["gloci", "gloci-t8", "samtools", "samtools-t8"]


