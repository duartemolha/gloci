# Benchmark external datasets.
# Entries: name, url, one checksum (sha256 or md5, hex), unpack (boolean).
# Datasets are fetched to $GLOCI_BENCH_CACHE and verified before use.
#
# Paper datasets (paper = true, D95) are fetched only by
# `cargo xtask paper fetch` or paper/fetch-datasets.sh, never by CI: no
# workflow runs either, and no nightly case uses one (the exception is
# 1kg-30x-chr20, which nightly already fetched before the paper). Every one
# carries the provider's own published md5, checked on 2026-11-12.
# [[derived]] inputs are made from them with LC_ALL=C in the bench image; an
# empty sha256 is TO-PIN: `cargo xtask paper fetch --record` fills it on a
# workstation (derived inputs need the multi-GB downloads, so they could not
# be pinned when this was written). Regenerate the script with
# `cargo xtask paper fetch-script` after any edit.
#
# bioRxiv 2025.02.19.639167 (§9.2, deferred by D53): the preprint's data
# statement names no downloadable input set, so it is not pinned. Its
# comparisons run on the public datasets below. Revisit if the authors
# publish their inputs.
#
# coitrees: the coitrees benchmark data (Ensembl annotations against RNA-Seq
# alignments) has no public download: the repository has no releases and its
# bench/bench.jl reads local test1/test2 BED files. The dataset and its two
# yardstick cases were removed rather than point at an invented URL.

[[dataset]]
# 1000 Genomes 30x high coverage (NYGC, 3,202 samples), chr20 phased
# SNV/INDEL/SV panel, 687,320,087 bytes. Listed with curl from
# https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/working/20220422_3202_phased_SNV_INDEL_SV/
# Checksum source: the provider's manifest 20220804_manifest.txt in that
# directory (md5). A download on 2026-11-09 matched it; its sha256 was
# 9e936fdf434a4aa4ff1d37c0d386a13a43a7211d4f09fb5da811ed6eb5125626.
name = "1kg-30x-chr20"
url = "https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/working/20220422_3202_phased_SNV_INDEL_SV/1kGP_high_coverage_Illumina.chr20.filtered.SNV_INDEL_SV_phased_panel.vcf.gz"
md5 = "34a9a5dbfb285e7eb9d1f2881953014b"
unpack = false
paper = true

# Everything below is paper = true. All ENCODE items are GRCh38 (assembly
# recorded per item below).

[[dataset]]
# GENCODE v46 comprehensive annotation (GRCh38), 51,006,804 bytes.
# Checksum source: release_46/MD5SUMS on the EBI FTP.
name = "gencode-v46-gtf"
url = "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_46/gencode.v46.annotation.gtf.gz"
md5 = "68070e3c87f6a0e70af6e4ff4d55f61c"
paper = true

[[dataset]]
# ENCODE SCREEN cCREs v4 (ENCSR800VNX), GRCh38, 32,795,453 bytes.
# Checksum source: the ENCODE portal's md5sum for ENCFF420VPZ.
name = "encode-ccre-v4"
url = "https://www.encodeproject.org/files/ENCFF420VPZ/@@download/ENCFF420VPZ.bed.gz"
md5 = "ea1820bd71581ba01c94fc600fbf794d"
paper = true

[[dataset]]
# CTCF ChIP-seq in K562 (ENCSR000AKO), GRCh38 IDR peaks, 919,491 bytes.
# Checksum source: the ENCODE portal's md5sum for ENCFF769AUF.
name = "encode-ctcf-k562-peaks"
url = "https://www.encodeproject.org/files/ENCFF769AUF/@@download/ENCFF769AUF.bed.gz"
md5 = "7d086cac19c5311a77b7e21e3d931435"
paper = true

[[dataset]]
# CTCF ChIP-seq in K562 (ENCSR000AKO), GRCh38 fold-change signal, 502,671,302 bytes.
# Checksum source: the ENCODE portal's md5sum for ENCFF979PWH.
name = "encode-ctcf-k562-fc"
url = "https://www.encodeproject.org/files/ENCFF979PWH/@@download/ENCFF979PWH.bigWig"
md5 = "4a1da9d7819bc622c27cd60950d28abb"
paper = true

[[dataset]]
# gnomAD v4.1 exomes sites, chr22 (sites only: no samples), 5,060,347,554
# bytes. Checksum source: the x-goog-hash header of the object
# (md5=3PGRVj5pBUpxvU3HeGJ5mg==, base64 of this hex).
name = "gnomad-v4.1-exomes-chr22"
url = "https://storage.googleapis.com/gcp-public-data--gnomad/release/4.1/vcf/exomes/gnomad.exomes.v4.1.sites.chr22.vcf.bgz"
md5 = "dcf191563e69054a71bd4dc77862799a"
