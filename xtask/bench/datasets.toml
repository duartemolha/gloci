# ---- derived inputs (D95) ----
# Byte-determinism: pins are only useful if a rebuild gives the same bytes. Every
# `bcftools view` has --no-version (no ##bcftools_viewCommand with date and
# path), samtools has --no-PG, and nothing embeds a path or a time. TASK 15:
# before recording, derive each input twice into different cache directories
# (`cargo xtask paper fetch --data-dir A`, then `--data-dir B`) and compare the
# digests; pin only when they agree.
# Commands run in the bench image under `bash -o pipefail` with LC_ALL=C.
# {in} is the first `from`, {in2} the second; {out} is the result.

[[derived]]
name = "exons-unsorted.bed"
from = ["gencode-v46-gtf"]
command = '''zcat {in} | gawk -F'\t' -v OFS='\t' '$3=="exon"{match($9,/gene_name "[^"]+"/);print $1,$4-1,$5,substr($9,RSTART+11,RLENGTH-12),0,$7}' > {out}'''
sha256 = "915ed366960cbd4ec72a1f3ee54d48c9b3e29c72b924bf12eba148ec87c1dd69"

# sort-bed order (chromosome, start, end), which bedops needs: sorted by start
# alone, bedops --partition wrote 42,593 rows with start past end and
# closest-features picked other neighbours for 4,832 peaks.
[[derived]]
name = "exons.bed"
from = ["exons-unsorted.bed"]
command = "sort -k1,1 -k2,2n -k3,3n -s {in} > {out}"
sha256 = "ebd86df27ee539d7422d667cbe30fa4fca3a08f5dd096dca92a7dcf5123632e3"

[[derived]]
name = "ccre.bed"
from = ["encode-ccre-v4"]
command = "zcat {in} | cut -f1-6 | sort -k1,1 -k2,2n -s > {out}"
sha256 = "5b2c8d03c699baf152c982bba95fd168beae2b0416f2181d643f9c2bb9ead5f3"

[[derived]]
name = "ccre.bed.gz"
from = ["ccre.bed"]
command = "bgzip -c {in} > {out} && tabix -p bed {out}"
sha256 = "558e3ef6f06253d939c699f973989a6a6d9498cc8d83166ccfc6273a00dd744c"

[[derived]]
name = "exons.bed.gz"
from = ["exons.bed"]
command = "bgzip -c {in} > {out} && tabix -p bed {out}"
sha256 = "63f807c0cba04db8e5ab0a0c761f8f58a0e6933432e43e5b3b26558217f01724"

[[derived]]
name = "ctcf-fc.bedgraph"
from = ["encode-ctcf-k562-fc"]
command = "bigWigToBedGraph {in} /dev/stdout | sort -k1,1 -k2,2n -s > {out}"
sha256 = "1477693dbaff846a203295fd29d1115e507589296e0aba4661ade690c3e6cb1a"

# The signal as five-column BED (the value in column 5), which bedmap reads.
[[derived]]
name = "ctcf-fc.bed5"
from = ["ctcf-fc.bedgraph"]
command = '''gawk -v OFS='\t' '{print $1,$2,$3,".",$4}' {in} > {out}'''
sha256 = "62258b45a53c1cd22ba58b67b9c21886b006d3090904c4b0f35643cdf7dfc55c"

[[derived]]
name = "1kg-chr20.bcf"
from = ["1kg-30x-chr20"]
command = "bcftools view --no-version -Ob -o {out} {in} && bcftools index {out}"
sha256 = "5041e7f9cd6cc55025ce0fd1b9d174c12851e503717df869c5a43e04771c9835"

[[derived]]
# p1 and p2 are DISJOINT halves of chr20 (1-30,000,000 and 30,000,001-end). That
# is fine for timing `vcf compare` (same sizes, same sample columns), but it
# says nothing about concordance: concordance runs use other inputs (two calls
# of the same samples). The first half of chr20; `bcftools index` writes the .tbi beside the input.
name = "1kg-chr20.p1.vcf.gz"
from = ["1kg-30x-chr20"]
command = "bcftools index -f -t {in} && bcftools view --no-version -Oz -r chr20:1-30000000 -o {out} {in} && bcftools index -t {out}"
sha256 = "93be1bd3a387592d483471a626bcded73bad1769093c362e24040cd674097b27"

[[derived]]
name = "1kg-chr20.p2.vcf.gz"
from = ["1kg-30x-chr20"]
command = "bcftools index -f -t {in} && bcftools view --no-version -Oz -r chr20:30000001- -o {out} {in} && bcftools index -t {out}"
sha256 = "f6f86390be54872fbe6f10b72a74ad181d19d88dd44e88f0a4c7ec4c34be6e22"

[[derived]]
# Addition (P3): the ENCODE BAM, indexed (`.bai` beside it) for depth, flagstat,
# idxstats, bedcov and view --count. ENCODE's filtered alignments are already
# coordinate-sorted, and `samtools index` fails on unsorted input, so the BAM
# is copied byte for byte: no re-sort, hence no tie-order or @PG question.
name = "ctcf-k562.bam"
from = ["encode-ctcf-k562-bam"]
command = "cp {in} {out} && samtools index -@ 4 {out}"
sha256 = "7e86b221c30456d5a10f988d272a5f5af978ab55336ab28f7301efeb81d3fdb3"

[[derived]]
# Addition (P3): the same reads as CRAM, written without embedded or external
# reference (no_ref), so no reference download is needed. Deterministic bytes:
# --no-PG drops the @PG line (it carries paths), and the CRAM file definition
# holds the output file name (htslib copies it into the 20-byte file id), so
# the file is written under a fixed name in a scratch directory, then moved.
# Single-threaded (-@ 0): with -@ 4 htslib picks codecs per slice by trial and
# the choice depends on slice arrival order, so two runs gave different bytes
# (found by deriving twice, Task 15).
name = "ctcf-k562.cram"
from = ["ctcf-k562.bam"]
command = '''t=$(mktemp -d) && (cd "$t" && samtools view -C --output-fmt-option no_ref --no-PG -@ 0 -o c.cram {in} && samtools index c.cram) && mv "$t/c.cram.crai" {out}.crai && mv "$t/c.cram" {out} && rmdir "$t"'''
sha256 = "d65a67fb0f98abc76b3c7de888056c28cda4f4cde717f9c4d3e89303213111b1"

[[derived]]
# The bedcov target list, sorted. It also checks that every contig of the peaks
# (GRCh38, chr-prefixed) is an @SQ of the BAM (GRCh38 no-alt analysis set), and
# fails otherwise: bedcov would silently count nothing on a missing contig.
name = "ctcf-peaks.bed"
from = ["encode-ctcf-k562-peaks", "ctcf-k562.bam"]
command = '''zcat {in} | cut -f1-6 | sort -k1,1 -k2,2n -s > {out} && missing=$(comm -23 <(cut -f1 {out} | sort -u) <(samtools view -H {in2} | gawk -F'\t' '$1=="@SQ"{sub("SN:","",$2);print $2}' | sort)) && [ -z "$missing" ] || { echo "contigs of the CTCF peaks that are not @SQ of the BAM: $missing" >&2; false; }'''
sha256 = "2f669c78b6b56ee317fc9142a8a7a4be45f263f861828b01c715bffe6d300f9d"

[[derived]]
name = "hg38.lex.genome"
from = ["repo:crates/gloci-io/data/genomes/hg38.genome"]
command = "sort -k1,1 {in} > {out}"
sha256 = "f0114a219fb57b6c3948c075a8ff9d0b87aa461b5a753f4e9aa749e7ad7a994d"
